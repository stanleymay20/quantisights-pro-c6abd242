name: Apply Salesforce pull pilot hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_pilot-salesforce-pull-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Patch Salesforce pull
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/connector-salesforce-pull/index.ts')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, found {text.count(old)} for: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once('// @ts-nocheck\n', '')

          replace_once(
              'import { assertSoqlSafe, type SoqlGovernance } from "../_shared/soql-guard.ts";\n',
              'import { assertSoqlSafe, type SoqlGovernance } from "../_shared/soql-guard.ts";\n'
              'import {\n'
              '  normalizeSalesforceObjects,\n'
              '  parseSalesforcePullRequest,\n'
              '  parseSalesforceQueryPage,\n'
              '  safeSalesforceHttpError,\n'
              '  validateSalesforceCursor,\n'
              '} from "../_shared/salesforce-pull-guard.ts";\n'
          )

          replace_once(
              'const SOURCE = "salesforce" as const;\n',
              'const SOURCE = "salesforce" as const;\n'
              'const FETCH_TIMEOUT_MS = 60_000;\n'
              'const DEFAULT_OBJECTS = ["Account", "Contact", "Opportunity", "Case", "Task", "Event"] as const;\n'
          )

          replace_once(
              '  const cors = getCorsHeaders(req);\n'
              '  const svc = createClient(Deno.env.get("SUPABASE_URL")!, Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);\n\n'
              '  try {\n'
              '    const { connector_id, mode: requestedMode } = await req.json().catch(() => ({}));\n'
              '    if (!connector_id) return json({ error: "connector_id required" }, 400, cors);\n\n'
              '    const { data: connector, error: cErr } = await svc.from("data_connectors").select("*").eq("id", connector_id).single();\n'
              '    if (cErr || !connector) return json({ error: "connector not found" }, 404, cors);\n'
              '    const orgId = connector.organization_id;\n'
              '    const cfg = (connector.config ?? {}) as { mode?: Mode; objects?: string[]; governance?: SoqlGovernance };\n'
              '    const mode: Mode = (requestedMode as Mode) || cfg.mode || "incremental_sync";\n'
              '    const gov: SoqlGovernance = { ...DEFAULT_GOV, ...(cfg.governance ?? {}) };\n'
              '    const objects = cfg.objects ?? ["Account", "Contact", "Opportunity", "Case", "Task", "Event"];\n',
              '  const cors = getCorsHeaders(req);\n'
              '  const supabaseUrl = Deno.env.get("SUPABASE_URL");\n'
              '  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n'
              '  if (!supabaseUrl || !serviceRoleKey) {\n'
              '    return json({ error: "Salesforce pull service unavailable" }, 503, cors);\n'
              '  }\n'
              '  const svc = createClient(supabaseUrl, serviceRoleKey);\n\n'
              '  try {\n'
              '    let request;\n'
              '    try {\n'
              '      request = parseSalesforcePullRequest(await req.json().catch(() => null));\n'
              '    } catch (error) {\n'
              '      return json({ error: error instanceof Error ? error.message : String(error) }, 400, cors);\n'
              '    }\n'
              '    const connector_id = request.connectorId;\n\n'
              '    const { data: connector, error: cErr } = await svc.from("data_connectors").select("*").eq("id", connector_id).single();\n'
              '    if (cErr || !connector) return json({ error: "connector not found" }, 404, cors);\n'
              '    if (connector.connector_type !== "salesforce") return json({ error: "not a Salesforce connector" }, 400, cors);\n'
              '    if (typeof connector.organization_id !== "string" || !connector.organization_id) {\n'
              '      return json({ error: "connector organization missing" }, 500, cors);\n'
              '    }\n'
              '    const orgId = connector.organization_id;\n'
              '    const cfg = (connector.config ?? {}) as { mode?: Mode; objects?: unknown; governance?: SoqlGovernance };\n'
              '    const mode: Mode = request.mode ?? cfg.mode ?? "incremental_sync";\n'
              '    if (mode !== "historical_backfill" && mode !== "incremental_sync") {\n'
              '      return json({ error: "connector config mode is invalid" }, 400, cors);\n'
              '    }\n'
              '    const gov: SoqlGovernance = { ...DEFAULT_GOV, ...(cfg.governance ?? {}) };\n'
              '    let objects: string[];\n'
              '    try {\n'
              '      objects = normalizeSalesforceObjects(cfg.objects, DEFAULT_OBJECTS, gov.allowed_objects ?? DEFAULT_GOV.allowed_objects);\n'
              '    } catch (error) {\n'
              '      return json({ error: error instanceof Error ? error.message : String(error) }, 400, cors);\n'
              '    }\n'
          )

          replace_once(
              'async function getCheckpoint(ctx: Ctx, field: string): Promise<string | null> {\n'
              '  if (ctx.mode === "historical_backfill") return null;\n'
              '  const { data } = await ctx.svc.from("connector_sync_checkpoints").select("cursor_value,high_watermark")\n'
              '    .eq("connector_id", ctx.connectorId).eq("cursor_field", field).maybeSingle();\n'
              '  return data?.cursor_value ?? null;\n'
              '}\n'
              'async function setCheckpoint(ctx: Ctx, field: string, value: string): Promise<void> {\n'
              '  await ctx.svc.from("connector_sync_checkpoints").upsert({\n'
              '    organization_id: ctx.orgId, connector_id: ctx.connectorId,\n'
              '    cursor_field: field, cursor_value: value,\n'
              '    high_watermark: value,                   // CDC-ready\n'
              '    change_event_ready: false,               // flip when Streaming/CDC adopted\n'
              '    updated_at: new Date().toISOString(),\n'
              '  }, { onConflict: "connector_id,cursor_field" });\n'
              '}\n',
              'async function getCheckpoint(ctx: Ctx, field: string): Promise<string | null> {\n'
              '  if (ctx.mode === "historical_backfill") return null;\n'
              '  const { data, error } = await ctx.svc.from("connector_sync_checkpoints").select("cursor_value,high_watermark")\n'
              '    .eq("organization_id", ctx.orgId).eq("connector_id", ctx.connectorId).eq("cursor_field", field).maybeSingle();\n'
              '  if (error) throw new Error(`unable to read Salesforce checkpoint ${field}: ${error.message}`);\n'
              '  return validateSalesforceCursor(data?.high_watermark ?? data?.cursor_value ?? null);\n'
              '}\n'
              'async function setCheckpoint(ctx: Ctx, field: string, value: string): Promise<void> {\n'
              '  const cursor = validateSalesforceCursor(value);\n'
              '  if (!cursor) throw new Error(`refusing to persist empty Salesforce checkpoint ${field}`);\n'
              '  const { error } = await ctx.svc.from("connector_sync_checkpoints").upsert({\n'
              '    organization_id: ctx.orgId, connector_id: ctx.connectorId,\n'
              '    cursor_field: field, cursor_value: cursor,\n'
              '    high_watermark: cursor,                  // CDC-ready\n'
              '    change_event_ready: false,               // flip when Streaming/CDC adopted\n'
              '    updated_at: new Date().toISOString(),\n'
              '  }, { onConflict: "connector_id,cursor_field" });\n'
              '  if (error) throw new Error(`unable to persist Salesforce checkpoint ${field}: ${error.message}`);\n'
              '}\n'
          )

          replace_once(
              '    const res = await fetch(nextUrl, { headers: { Authorization: `Bearer ${ctx.tokens.access_token}` } });\n'
              '    const obs = await observeResponse(ctx.svc, { orgId: ctx.orgId, connectorId: ctx.connectorId, vendor: VENDOR, res });\n'
              '    if (obs.throttled) { await new Promise(r => setTimeout(r, obs.suggestedRetryMs)); continue; }\n'
              '    if (!res.ok) {\n'
              '      // SOQL errors return a JSON array; we log status + ErrorCode but NOT headers.\n'
              '      const txt = await res.text();\n'
              '      throw new Error(`Salesforce SOQL ${res.status}: ${txt.slice(0, 300)}`);\n'
              '    }\n'
              '    const body: any = await res.json();\n'
              '    yield body.records ?? [];\n'
              '    nextUrl = body.nextRecordsUrl ? `${ctx.tokens.instance_url}${body.nextRecordsUrl}` : null;\n'
              '    pages++;\n'
              '  }\n'
              '}\n',
              '    const res = await fetch(nextUrl, {\n'
              '      headers: { Authorization: `Bearer ${ctx.tokens.access_token}` },\n'
              '      signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),\n'
              '    });\n'
              '    const obs = await observeResponse(ctx.svc, { orgId: ctx.orgId, connectorId: ctx.connectorId, vendor: VENDOR, res });\n'
              '    if (obs.throttled) { await new Promise(r => setTimeout(r, obs.suggestedRetryMs)); continue; }\n'
              '    const rawBody: unknown = await res.json().catch(() => null);\n'
              '    if (!res.ok) throw new Error(safeSalesforceHttpError(res.status, rawBody));\n'
              '    const page = parseSalesforceQueryPage(rawBody);\n'
              '    yield page.records as any[];\n'
              '    nextUrl = page.nextRecordsUrl ? `${ctx.tokens.instance_url}${page.nextRecordsUrl}` : null;\n'
              '    pages++;\n'
              '  }\n'
              '  if (nextUrl) throw new Error(`Salesforce pagination exceeded safety cap (${MAX_PAGES} pages)`);\n'
              '}\n'
          )

          replace_once(
              'function json(body: any, status: number, cors: Record<string, string>) {\n',
              'function json(body: unknown, status: number, cors: Record<string, string>) {\n'
          )

          path.write_text(text)
          PY

      - name: Commit hardened pull path and remove one-time workflow
        run: |
          rm .github/workflows/_pilot-salesforce-pull-patch.yml
          git config user.name "quantivis-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/connector-salesforce-pull/index.ts .github/workflows/_pilot-salesforce-pull-patch.yml
          git commit -m "Harden Salesforce pull runtime boundary"
          git push origin main
