name: One-shot staging Auth leaked-password hardening

on:
  push:
    branches:
      - security/staging-auth-hibp-20260904
    paths:
      - .github/workflows/one-shot-staging-auth-hibp.yml

permissions:
  contents: read

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
      STAGING_AUTH_EMAIL_SEND_LIMIT: "120"
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/staging-auth-hibp-20260904
          persist-credentials: false

      - name: Verify staging target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$SUPABASE_PROJECT_REF" = "cmnihsbdbpubznlkmjbc"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Enforce and verify staging Auth security baseline
        run: node scripts/configure-staging-auth-rate-limits.mjs
