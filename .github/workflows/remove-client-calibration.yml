name: Remove Client Calibration Shortcut

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-client-calibration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Remove duplicate browser calibration calculation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/DecisionLedger.tsx")
          text = path.read_text()
          start_marker = "    // Compute derived fields upfront\n"
          end_marker = "    // ── OPTIMISTIC UPDATE: reflect change instantly ──\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Calibration shortcut markers not found")

          replacement = (
              "    // Calibration and prediction accuracy are outcome-lifecycle fields.\n"
              "    // Do not infer success from the sign of outcome_delta here: lower-is-better\n"
              "    // KPIs require direction-aware evaluation after measured outcome data arrives.\n\n"
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/remove-client-calibration.yml

      - name: Commit directly to main
        run: |
          git config user.name "quantivis-integrity-bot"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add src/pages/DecisionLedger.tsx
          git commit -m "Remove duplicate client calibration shortcut"
          git push origin HEAD:main
