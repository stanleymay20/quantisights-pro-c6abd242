name: Apply HubSpot paid-pilot hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_pilot-hubspot-pull-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Patch HubSpot pull
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/connector-hubspot-pull/index.ts')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once('// @ts-nocheck\n', '')

          replace_once(
              'import { shouldAllow, recordSuccess, recordFailure, deadLetter } from "../_shared/connector-isolation.ts";\n',
              'import { shouldAllow, recordSuccess, recordFailure, deadLetter } from "../_shared/connector-isolation.ts";\n'
              'import { authorizeConnectorInvocation } from "../_shared/connector-invocation-auth.ts";\n'
              'import { resolveConnectorCredentials } from "../_shared/connector-credentials.ts";\n'
          )
          replace_once(
              'import { logConnectorEvent } from "../_shared/warehouse-config.ts";\n',
              'import { logConnectorEvent } from "../_shared/warehouse-config.ts";\n'
              'import {\n'
              '  normalizeHubSpotObjects,\n'
              '  normalizeHubSpotPageSize,\n'
              '  parseHubSpotCollectionPage,\n'
              '  parseHubSpotPullRequest,\n'
              '  safeHubSpotHttpError,\n'
              '  validateHubSpotCursor,\n'
              '} from "../_shared/hubspot-pull-guard.ts";\n'
          )
          replace_once(
              'const SOURCE = "hubspot" as const;\n',
              'const SOURCE = "hubspot" as const;\nconst FETCH_TIMEOUT_MS = 60_000;\n'
          )

          replace_once(
              '  const cors = getCorsHeaders(req);\n'
              '  const svc = createClient(Deno.env.get("SUPABASE_URL")!, Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);\n\n'
              '  try {\n'
              '    const { connector_id, mode: requestedMode } = await req.json().catch(() => ({}));\n'
              '    if (!connector_id) return json({ error: "connector_id required" }, 400, cors);\n\n'
              '    const { data: connector, error: cErr } = await svc.from("data_connectors").select("*").eq("id", connector_id).single();\n'
              '    if (cErr || !connector) return json({ error: "connector not found" }, 404, cors);\n\n'
              '    const orgId = connector.organization_id;\n'
              '    const cfg = (connector.config ?? {}) as { mode?: Mode; objects?: string[]; page_size?: number };\n'
              '    const mode: Mode = (requestedMode as Mode) || cfg.mode || "incremental_sync";\n'
              '    const objects = cfg.objects ?? ["companies", "contacts", "deals", "pipelines", "activities"];\n'
              '    const pageSize = Math.min(100, cfg.page_size ?? (mode === "historical_backfill" ? 100 : 50));\n',
              '  const cors = getCorsHeaders(req);\n'
              '  const supabaseUrl = Deno.env.get("SUPABASE_URL");\n'
              '  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n'
              '  if (!supabaseUrl || !serviceRoleKey) return json({ error: "HubSpot pull service unavailable" }, 503, cors);\n'
              '  const svc = createClient(supabaseUrl, serviceRoleKey);\n\n'
              '  try {\n'
              '    let request;\n'
              '    try {\n'
              '      request = parseHubSpotPullRequest(await req.json().catch(() => null));\n'
              '    } catch (error) {\n'
              '      return json({ error: error instanceof Error ? error.message : String(error) }, 400, cors);\n'
              '    }\n'
              '    const connector_id = request.connectorId;\n\n'
              '    const { data: connector, error: cErr } = await svc.from("data_connectors").select("*").eq("id", connector_id).single();\n'
              '    if (cErr || !connector) return json({ error: "connector not found" }, 404, cors);\n'
              '    if (connector.connector_type !== "hubspot") return json({ error: "not a HubSpot connector" }, 400, cors);\n'
              '    if (typeof connector.organization_id !== "string" || !connector.organization_id) return json({ error: "connector organization missing" }, 500, cors);\n\n'
              '    const orgId = connector.organization_id;\n'
              '    const authHeader = req.headers.get("authorization");\n'
              '    const anonKey = Deno.env.get("SUPABASE_ANON_KEY");\n'
              '    const userClient = anonKey\n'
              '      ? createClient(supabaseUrl, anonKey, { global: { headers: { Authorization: authHeader ?? "" } } })\n'
              '      : null;\n'
              '    const invocation = await authorizeConnectorInvocation({\n'
              '      authHeader, serviceRoleKey, organizationId: orgId, userClient, membershipClient: svc,\n'
              '    });\n'
              '    if (!invocation.allowed) {\n'
              '      return json({ error: invocation.reason === "forbidden" ? "Forbidden" : "Unauthorized" }, invocation.status, cors);\n'
              '    }\n\n'
              '    const cfg = (connector.config ?? {}) as { mode?: Mode; objects?: unknown; page_size?: unknown };\n'
              '    const mode: Mode = request.mode ?? cfg.mode ?? "incremental_sync";\n'
              '    if (mode !== "historical_backfill" && mode !== "incremental_sync") return json({ error: "connector config mode is invalid" }, 400, cors);\n'
              '    let objects;\n'
              '    let pageSize;\n'
              '    try {\n'
              '      objects = normalizeHubSpotObjects(cfg.objects);\n'
              '      pageSize = normalizeHubSpotPageSize(cfg.page_size, mode === "historical_backfill" ? 100 : 50);\n'
              '    } catch (error) {\n'
              '      return json({ error: error instanceof Error ? error.message : String(error) }, 400, cors);\n'
              '    }\n'
          )

          replace_once(
              '    const LOVABLE = Deno.env.get("LOVABLE_API_KEY");\n'
              '    const HS = Deno.env.get("HUBSPOT_API_KEY");\n'
              '    if (!LOVABLE || !HS) {\n'
              '      await recordFailure(svc, connector_id, "missing gateway secrets (LOVABLE_API_KEY/HUBSPOT_API_KEY)");\n'
              '      return json({ error: "HubSpot connector not linked" }, 412, cors);\n'
              '    }\n',
              '    const LOVABLE = Deno.env.get("LOVABLE_API_KEY");\n'
              '    const credentials = await resolveConnectorCredentials(svc, connector_id);\n'
              '    const HS = credentials.privateAppToken ?? credentials.apiKey ?? credentials.api_key;\n'
              '    if (!LOVABLE || !HS) {\n'
              '      await recordFailure(svc, connector_id, "missing HubSpot gateway or connector credential");\n'
              '      return json({ error: "HubSpot connector not linked" }, 412, cors);\n'
              '    }\n'
          )

          replace_once(
              'function json(body: any, status: number, cors: Record<string, string>) {\n',
              'function json(body: unknown, status: number, cors: Record<string, string>) {\n'
          )

          replace_once(
              'async function getCheckpoint(ctx: Ctx, field: string): Promise<string | null> {\n'
              '  if (ctx.mode === "historical_backfill") return null;\n'
              '  const { data } = await ctx.svc.from("connector_sync_checkpoints")\n'
              '    .select("cursor_value").eq("connector_id", ctx.connectorId).eq("cursor_field", field).maybeSingle();\n'
              '  return data?.cursor_value ?? null;\n'
              '}\n\n'
              'async function setCheckpoint(ctx: Ctx, field: string, value: string): Promise<void> {\n'
              '  await ctx.svc.from("connector_sync_checkpoints").upsert({\n'
              '    organization_id: ctx.orgId, connector_id: ctx.connectorId, cursor_field: field, cursor_value: value,\n'
              '    updated_at: new Date().toISOString(),\n'
              '  }, { onConflict: "connector_id,cursor_field" });\n'
              '}\n',
              'async function getCheckpoint(ctx: Ctx, field: string): Promise<string | null> {\n'
              '  if (ctx.mode === "historical_backfill") return null;\n'
              '  const { data, error } = await ctx.svc.from("connector_sync_checkpoints")\n'
              '    .select("cursor_value,high_watermark")\n'
              '    .eq("organization_id", ctx.orgId).eq("connector_id", ctx.connectorId).eq("cursor_field", field).maybeSingle();\n'
              '  if (error) throw new Error(`unable to read HubSpot checkpoint ${field}: ${error.message}`);\n'
              '  return validateHubSpotCursor(data?.high_watermark ?? data?.cursor_value ?? null);\n'
              '}\n\n'
              'async function setCheckpoint(ctx: Ctx, field: string, value: string): Promise<void> {\n'
              '  const cursor = validateHubSpotCursor(value);\n'
              '  if (!cursor) throw new Error(`refusing to persist empty HubSpot checkpoint ${field}`);\n'
              '  const { error } = await ctx.svc.from("connector_sync_checkpoints").upsert({\n'
              '    organization_id: ctx.orgId, connector_id: ctx.connectorId, cursor_field: field, cursor_value: cursor,\n'
              '    high_watermark: cursor, change_event_ready: false, updated_at: new Date().toISOString(),\n'
              '  }, { onConflict: "connector_id,cursor_field" });\n'
              '  if (error) throw new Error(`unable to persist HubSpot checkpoint ${field}: ${error.message}`);\n'
              '}\n'
          )

          replace_once(
              '    const res = await fetch(url, { method, headers: ctx.headers, body });\n'
              '    const obs = await observeResponse(ctx.svc, { orgId: ctx.orgId, connectorId: ctx.connectorId, vendor: VENDOR, res });\n\n'
              '    if (obs.throttled) {\n'
              '      // throttle handler already updated state; retry once after waiting\n'
              '      await new Promise(r => setTimeout(r, obs.suggestedRetryMs));\n'
              '      continue;\n'
              '    }\n'
              '    if (!res.ok) {\n'
              '      const text = await res.text();\n'
              '      throw new Error(`HubSpot ${opts.object} ${res.status}: ${text.slice(0, 300)}`);\n'
              '    }\n'
              '    const data = await res.json();\n'
              '    const results = data.results ?? [];\n'
              '    yield results;\n'
              '    after = data.paging?.next?.after;\n'
              '    if (!after || !results.length) return;\n'
              '    pageCount++;\n'
              '  }\n'
              '}\n',
              '    const res = await fetch(url, { method, headers: ctx.headers, body, signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });\n'
              '    const obs = await observeResponse(ctx.svc, { orgId: ctx.orgId, connectorId: ctx.connectorId, vendor: VENDOR, res });\n\n'
              '    if (obs.throttled) {\n'
              '      await new Promise(r => setTimeout(r, obs.suggestedRetryMs));\n'
              '      continue;\n'
              '    }\n'
              '    const raw: unknown = await res.json().catch(() => null);\n'
              '    if (!res.ok) throw new Error(safeHubSpotHttpError(opts.object, res.status, raw));\n'
              '    const page = parseHubSpotCollectionPage(raw);\n'
              '    yield page.results as any[];\n'
              '    after = page.after ?? undefined;\n'
              '    if (!after || !page.results.length) return;\n'
              '    pageCount++;\n'
              '  }\n'
              '  if (after) throw new Error(`HubSpot ${opts.object} pagination exceeded safety cap (${MAX_PAGES} pages)`);\n'
              '}\n'
          )

          replace_once(
              '  const res = await fetch(`${GATEWAY}/crm/v3/pipelines/deals`, { headers: ctx.headers });\n'
              '  await observeResponse(ctx.svc, { orgId: ctx.orgId, connectorId: ctx.connectorId, vendor: VENDOR, res });\n'
              '  if (!res.ok) throw new Error(`HubSpot pipelines ${res.status}`);\n'
              '  const data = await res.json();\n'
              '  const entities: any[] = [];\n'
              '  for (const p of data.results ?? []) {\n',
              '  const res = await fetch(`${GATEWAY}/crm/v3/pipelines/deals`, { headers: ctx.headers, signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });\n'
              '  const observation = await observeResponse(ctx.svc, { orgId: ctx.orgId, connectorId: ctx.connectorId, vendor: VENDOR, res });\n'
              '  if (observation.throttled) throw new Error("HubSpot pipelines rate limited; retry required");\n'
              '  const raw: unknown = await res.json().catch(() => null);\n'
              '  if (!res.ok) throw new Error(safeHubSpotHttpError("pipelines", res.status, raw));\n'
              '  const data = parseHubSpotCollectionPage(raw);\n'
              '  const entities: any[] = [];\n'
              '  for (const p of data.results as any[]) {\n'
          )

          path.write_text(text)
          PY
      - name: Commit hardened HubSpot pull and self-clean
        run: |
          rm .github/workflows/_pilot-hubspot-pull-patch.yml
          git config user.name "quantivis-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/connector-hubspot-pull/index.ts .github/workflows/_pilot-hubspot-pull-patch.yml
          git commit -m "Harden HubSpot pull for tenant pilots"
          git push origin main
