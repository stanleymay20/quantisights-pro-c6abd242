name: Repair Iteration 1 v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/trust-critical-iteration-1-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Repair release blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/aicis-evaluate-outcomes/index.ts')
          text = path.read_text()
          old = '          let businessSuccess: boolean | null = isExplicitManual'
          new = '          const businessSuccess: boolean | null = isExplicitManual'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Expected businessSuccess declaration not found')
          PY
          npm audit fix --package-lock-only

      - name: Verify fixes
        run: |
          grep -F 'const businessSuccess: boolean | null = isExplicitManual' supabase/functions/aicis-evaluate-outcomes/index.ts
          npm audit --audit-level=moderate

      - name: Commit repaired files when changed
        run: |
          if git diff --quiet -- package-lock.json supabase/functions/aicis-evaluate-outcomes/index.ts; then
            echo "Release blockers already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json supabase/functions/aicis-evaluate-outcomes/index.ts
          git commit -m "Fix iteration 1 release blockers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
