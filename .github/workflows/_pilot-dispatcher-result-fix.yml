name: Fix connector dispatcher result state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_pilot-dispatcher-result-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Make dispatcher result fail-closed by default
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/connector-pull/index.ts')
          text = path.read_text()
          old = '    let result: { records: number; errors: string[] };\n'
          new = '    let result: { records: number; errors: string[] } = {\n      records: 0,\n      errors: ["Connector execution did not produce a result"],\n    };\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one result declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and self-clean
        run: |
          rm .github/workflows/_pilot-dispatcher-result-fix.yml
          git config user.name "quantivis-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/connector-pull/index.ts .github/workflows/_pilot-dispatcher-result-fix.yml
          git commit -m "Fail connector dispatcher closed on missing result"
          git push origin main
