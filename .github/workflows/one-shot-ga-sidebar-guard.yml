name: One-shot GA sidebar fail-closed guard

on:
  push:
    branches:
      - commercial/ga-contract-reconcile-20260904
    paths:
      - .github/workflows/one-shot-ga-sidebar-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial/ga-contract-reconcile-20260904
          fetch-depth: 1

      - name: Apply exact sidebar guard repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/dashboard/DashboardSidebar.tsx")
          source = path.read_text()

          old_guard = '''  const showAdvanced =\n    !orgRole || orgRole === "owner" || orgRole === "admin" || orgRole === "executive" || orgRole === "steward";'''
          new_guard = '''  const showAdvanced =\n    orgRole === "owner" || orgRole === "admin" || orgRole === "executive" || orgRole === "steward";'''

          if source.count(old_guard) != 1:
              raise SystemExit("Expected exactly one unresolved-role Advanced guard")

          old_comment = "//   Dashboard · Decisions · Operations · Reports · Governance · Settings"
          new_comment = "//   Dashboard · Decisions · Outcomes · Reports · Governance · Settings"
          if source.count(old_comment) != 1:
              raise SystemExit("Expected exactly one stale Operations IA comment")

          source = source.replace(old_guard, new_guard, 1).replace(old_comment, new_comment, 1)
          path.write_text(source)

      - name: Commit sidebar-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/DashboardSidebar.tsx
          test "$(git diff --cached --name-only)" = "src/components/dashboard/DashboardSidebar.tsx"
          git commit -m "Fail Advanced navigation closed until role resolves"
          git push origin HEAD:commercial/ga-contract-reconcile-20260904
