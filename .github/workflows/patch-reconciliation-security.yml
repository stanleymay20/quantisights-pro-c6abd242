name: Patch reconciliation SQL security

on:
  push:
    branches:
      - hardening/reconciliation-source-evidence-20261017

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/reconciliation-source-evidence-20261017
          fetch-depth: 0
      - name: Patch migration
        run: |
          python -c 'from pathlib import Path; p=Path("supabase/migrations/20261017153000_add_reconciliation_source_evidence.sql"); s=p.read_text(); assert s.count("SET search_path = public, pg_temp")==3; s=s.replace("SET search_path = public, pg_temp", "SET search_path = '\''\''"); a="DROP TRIGGER IF EXISTS protect_execution_reconciliation_evidence\n  ON public.execution_action_receipts;"; r="REVOKE ALL ON FUNCTION public.protect_execution_reconciliation_evidence()\n  FROM PUBLIC, anon, authenticated;\n\n"+a; assert s.count(a)==1; p.write_text(s.replace(a,r,1))'
      - name: Remove helper
        run: git rm .github/workflows/patch-reconciliation-security.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Security: pin reconciliation RPC search paths"
          git push origin HEAD:hardening/reconciliation-source-evidence-20261017
