name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Strict trusted-kernel typecheck
        run: npm run typecheck:trusted

      - name: Typecheck privileged Edge functions
        run: |
          deno check supabase/functions/auth-rate-limiter/index.ts
          deno check supabase/functions/connector-credential-store/index.ts
          deno check supabase/functions/connector-scheduler/index.ts
          deno check supabase/functions/api-ingest/index.ts
          deno check supabase/functions/connector-rest-sync/index.ts
          deno check supabase/functions/connector-pull/index.ts
          deno check supabase/functions/connector-salesforce-discover/index.ts
          deno check supabase/functions/connector-salesforce-pull/index.ts
          deno check supabase/functions/connector-hubspot-pull/index.ts

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
