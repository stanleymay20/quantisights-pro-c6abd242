name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Staging serializes every deployable main SHA. CI therefore must preserve an
# exact result for every pushed SHA rather than cancelling an older run when a
# newer commit arrives; GA Readiness verifies that exact prerequisite evidence.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Strict trusted-kernel typecheck
        run: npm run typecheck:trusted

      - name: Prepare supplier-risk Edge runtime
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Typecheck privileged Edge functions
        run: |
          failed=0

          check_edge() {
            config="$1"
            file="$2"
            echo "::group::deno check ${file}"
            if ! deno check --config "$config" "$file"; then
              echo "::error file=${file}::Privileged Edge function typecheck failed"
              failed=1
            fi
            echo "::endgroup::"
          }

          check_edge supabase/functions/deno.json supabase/functions/auth-rate-limiter/index.ts
          check_edge supabase/functions/deno.json supabase/functions/delete-account/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-credential-store/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-scheduler/index.ts
          check_edge supabase/functions/deno.json supabase/functions/api-ingest/index.ts
          check_edge supabase/functions/deno.json supabase/functions/webhook-ingest/index.ts
          check_edge supabase/functions/deno.json supabase/functions/event-stream/index.ts
          check_edge supabase/functions/deno.json supabase/functions/queued-metric-ingest/index.ts
          check_edge supabase/functions/deno.json supabase/functions/process-metric-ingest-queue/index.ts
          check_edge supabase/functions/deno.json supabase/functions/refresh-aggregates/index.ts
          check_edge supabase/functions/deno.json supabase/functions/ingest-csv-pipeline/index.ts
          check_edge supabase/functions/deno.json supabase/functions/ingest-external-signals/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-rest-sync/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/db-connector/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-sheets-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-dynamics-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-netsuite-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-dq-compute/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-sap-discover/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-sap-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-bigquery-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-snowflake-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-s3-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-salesforce-discover/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-salesforce-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/connector-hubspot-pull/index.ts
          check_edge supabase/functions/deno.json supabase/functions/executive-orchestration/index.ts
          check_edge supabase/functions/deno.json supabase/functions/execution-intelligence/index.ts
          check_edge supabase/functions/deno.json supabase/functions/predictive-forecast/index.ts
          check_edge supabase/functions/deno.json supabase/functions/supplier-risk-runtime-ingest/index.ts
          check_edge supabase/functions/deno.json supabase/functions/detect-executive-contradictions/index.ts
          check_edge supabase/functions/deno.json supabase/functions/prescriptive-advisory/index.ts
          check_edge supabase/functions/deno.json supabase/functions/compute-trust-metrics/index.ts
          check_edge supabase/functions/deno.json supabase/functions/auto-create-decisions/index.ts
          check_edge supabase/functions/deno.json supabase/functions/aicis-auto-decisions/index.ts
          check_edge supabase/functions/deno.json supabase/functions/aicis-evaluate-outcomes/index.ts
          check_edge supabase/functions/deno.json supabase/functions/complete-onboarding/index.ts
          check_edge supabase/functions/deno.json supabase/functions/activate-pilot/index.ts
          check_edge supabase/functions/deno.json supabase/functions/decision-value-summary/index.ts
          check_edge supabase/functions/auth-email-hook/deno.json supabase/functions/auth-email-hook/index.ts
          check_edge supabase/functions/process-email-queue/deno.json supabase/functions/process-email-queue/index.ts

          if [ "$failed" -ne 0 ]; then
            echo "One or more privileged Edge function typechecks failed."
            exit 1
          fi

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Build deployable production frontend
        run: env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY npm run build

      - name: Upload production frontend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: quantivis-production-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Audit dependencies
        id: dependency_audit
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/npm-audit
          set +e
          npm audit --audit-level=moderate --json > artifacts/npm-audit/npm-audit.json
          audit_status=$?
          set -e
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"
          exit "$audit_status"

      - name: Upload dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-${{ github.sha }}
          path: artifacts/npm-audit/npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate dependency audit fix candidate
        if: ${{ steps.dependency_audit.outcome == 'failure' }}
        run: |
          set -Eeuo pipefail
          cp package-lock.json artifacts/npm-audit/package-lock.before.json

          set +e
          npm audit fix --package-lock-only --ignore-scripts --audit-level=moderate
          fix_status=$?
          npm audit --audit-level=moderate --json > artifacts/npm-audit/npm-audit-after-fix.json
          post_audit_status=$?
          set -e

          cp package-lock.json artifacts/npm-audit/package-lock.candidate.json
          git diff -- package.json package-lock.json > artifacts/npm-audit/audit-fix.patch || true
          printf '{"audit_fix_exit_code":%s,"post_fix_audit_exit_code":%s}\n' \
            "$fix_status" "$post_audit_status" > artifacts/npm-audit/audit-fix-status.json

      - name: Upload dependency audit fix candidate
        if: ${{ steps.dependency_audit.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-fix-candidate-${{ github.sha }}
          path: |
            artifacts/npm-audit/package-lock.before.json
            artifacts/npm-audit/package-lock.candidate.json
            artifacts/npm-audit/npm-audit-after-fix.json
            artifacts/npm-audit/audit-fix.patch
            artifacts/npm-audit/audit-fix-status.json
          if-no-files-found: error
          retention-days: 7
