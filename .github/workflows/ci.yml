name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Staging serializes every deployable main SHA. CI therefore must preserve an
# exact result for every pushed SHA rather than cancelling an older run when a
# newer commit arrives; GA Readiness verifies that exact prerequisite evidence.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Strict trusted-kernel typecheck
        run: npm run typecheck:trusted

      - name: Typecheck privileged Edge functions
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/auth-rate-limiter/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/delete-account/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-credential-store/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-scheduler/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/api-ingest/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/webhook-ingest/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/event-stream/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/ingest-csv-pipeline/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/ingest-external-signals/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-rest-sync/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-sheets-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-dynamics-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-netsuite-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-dq-compute/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-sap-discover/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-sap-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-bigquery-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-snowflake-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-s3-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-salesforce-discover/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-salesforce-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/connector-hubspot-pull/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/executive-orchestration/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/predictive-forecast/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/supplier-risk-runtime-ingest/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/detect-executive-contradictions/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/auto-create-decisions/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/complete-onboarding/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/activate-pilot/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/decision-value-summary/index.ts
          deno check --config supabase/functions/auth-email-hook/deno.json supabase/functions/auth-email-hook/index.ts
          deno check --config supabase/functions/process-email-queue/deno.json supabase/functions/process-email-queue/index.ts

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Build without injected client configuration
        run: env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
