name: Repair Nanoid Main Lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-nanoid-main.yml"

permissions:
  contents: write

concurrency:
  group: repair-nanoid-main-lock
  cancel-in-progress: false

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate audited lock resolution
        run: npm audit fix --package-lock-only

      - name: Verify dependency audit
        run: npm audit --audit-level=moderate

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix audited nanoid lock resolution"
          git pull --rebase origin main
          git push origin HEAD:main
