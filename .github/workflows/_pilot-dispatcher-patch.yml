name: Apply tenant-safe connector dispatcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_pilot-dispatcher-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Patch connector dispatcher trust boundary
        run: python .github/scripts/patch_connector_dispatcher.py
      - name: Commit dispatcher and self-clean
        run: |
          rm .github/workflows/_pilot-dispatcher-patch.yml
          rm .github/scripts/patch_connector_dispatcher.py
          git config user.name "quantivis-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/connector-pull/index.ts .github/workflows/_pilot-dispatcher-patch.yml .github/scripts/patch_connector_dispatcher.py
          git commit -m "Derive connector dispatcher tenant identity server-side"
          git push origin main
