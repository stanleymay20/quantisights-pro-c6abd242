name: One-shot staging OAuth preview repair

on:
  push:
    branches:
      - ga/p0-tenant-control-plane-20260902
    paths:
      - .github/workflows/one-shot-staging-oauth-preview-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
      AUTH_SITE_URL: https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app
      AUTH_URI_ALLOW_LIST: https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/auth/callback,https://quantivis-insights.lovable.app/auth/callback,https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/**,https://**--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/**,https://quantivis-insights.lovable.app/**
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Verify staging-only target
        run: |
          set -Eeuo pipefail
          test "$SUPABASE_PROJECT_REF" = "cmnihsbdbpubznlkmjbc"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$GITHUB_REPOSITORY" = "stanleymay20/quantisights-pro-c6abd242"
          test "$GITHUB_REF_NAME" = "ga/p0-tenant-control-plane-20260902"

      - name: Add and verify Netlify preview callback
        run: node scripts/configure-supabase-google-oauth.mjs redirects-only
