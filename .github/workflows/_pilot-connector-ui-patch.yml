name: Apply paid-pilot connector UI boundary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_pilot-connector-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Patch connector wizard
        run: python .github/scripts/patch_pilot_connector_ui.py
      - name: Commit and self-clean
        run: |
          rm .github/workflows/_pilot-connector-ui-patch.yml
          rm .github/scripts/patch_pilot_connector_ui.py
          git config user.name "quantivis-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/DataConnectors.tsx .github/workflows/_pilot-connector-ui-patch.yml .github/scripts/patch_pilot_connector_ui.py
          git commit -m "Restrict paid-pilot connector selection to certified paths"
          git push origin main
