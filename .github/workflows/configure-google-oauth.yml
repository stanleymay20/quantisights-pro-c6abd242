name: Configure Google OAuth

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Supabase environment to configure
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_project_ref:
        description: Type the exact Supabase project ref to confirm the target
        required: true
        type: string

concurrency:
  group: configure-google-oauth-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      SUPABASE_PROJECT_REF: ${{ inputs.target_environment == 'production' && 'izgfrekdamlgigehxoqs' || 'cmnihsbdbpubznlkmjbc' }}
      AUTH_SITE_URL: ${{ inputs.target_environment == 'production' && 'https://quantivis-insights.lovable.app' || 'https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app' }}
      AUTH_URI_ALLOW_LIST: ${{ inputs.target_environment == 'production' && 'https://quantivis-insights.lovable.app/**' || 'https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/**' }}
    steps:
      - name: Confirm target
        env:
          CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          set -Eeuo pipefail
          if [ "$CONFIRMED_PROJECT_REF" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Project confirmation does not match the selected ${TARGET_ENVIRONMENT:-environment} target"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "itpwpnwzzitkelffttyx" ]; then
            echo "::error::Retired Supabase project must never receive Auth configuration"
            exit 1
          fi
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}

      - name: Verify required environment secrets
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_ACCESS_TOKEN GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured in the ${TARGET_ENVIRONMENT} GitHub Environment"
              exit 1
            fi
          done
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}

      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record configuration source SHA
        run: |
          set -Eeuo pipefail
          echo "Configuring ${TARGET_ENVIRONMENT} from main SHA $(git rev-parse HEAD)"
          echo "Supabase project: ${SUPABASE_PROJECT_REF}"
          echo "Site URL: ${AUTH_SITE_URL}"
          echo "OAuth secret values are intentionally not printed."
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Configure and verify Google OAuth
        run: node scripts/configure-supabase-google-oauth.mjs
