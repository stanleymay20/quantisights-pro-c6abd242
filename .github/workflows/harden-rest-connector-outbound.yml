name: Harden REST Connector Outbound

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-rest-connector-outbound.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Route REST connector fetches through outbound guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/connector-rest-sync/index.ts")
          text = path.read_text()

          import_anchor = 'import { withRetry } from "../_shared/retry.ts";\n'
          import_line = 'import { safeOutboundFetch } from "../_shared/outbound-http.ts";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("REST connector retry import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_fetch = '        const resp = await fetch(url.toString(), { method, headers });'
          new_fetch = '        const resp = await safeOutboundFetch(url, { method, headers });'
          if old_fetch not in text:
              raise SystemExit("REST connector outbound fetch anchor not found")
          text = text.replace(old_fetch, new_fetch, 1)

          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/harden-rest-connector-outbound.yml

      - name: Commit directly to main
        run: |
          git config user.name "quantivis-integrity-bot"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add supabase/functions/connector-rest-sync/index.ts
          git commit -m "Guard REST connector outbound URLs"
          git push origin HEAD:main
