name: One-shot fflate lock repair

on:
  push:
    branches:
      - security/fflate-audit-repair-20260904
    paths:
      - .github/workflows/one-shot-fflate-lock-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/fflate-audit-repair-20260904

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Update only allowed fflate lock entries
        shell: bash
        run: |
          set -Eeuo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm update fflate --package-lock-only --ignore-scripts --no-audit

          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = after.packages?.['node_modules/fflate']?.version;
          const posthog = after.packages?.['node_modules/posthog-js/node_modules/fflate']?.version;
          if (root !== '0.8.3') throw new Error(`expected root fflate 0.8.3, got ${root}`);
          if (posthog !== '0.4.9') throw new Error(`expected posthog fflate 0.4.9, got ${posthog}`);
          if (JSON.stringify(before.packages?.['']) !== JSON.stringify(after.packages?.[''])) {
            throw new Error('root package manifest entry changed unexpectedly');
          }
          console.log(`validated fflate graph: root=${root}, posthog=${posthog}`);
          NODE

      - name: Commit lockfile-only repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain -- package.json)"
          git diff --exit-code -- . ':!.github/workflows/one-shot-fflate-lock-repair.yml' ':!package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Repair vulnerable fflate transitive locks'
          git push origin HEAD:security/fflate-audit-repair-20260904
