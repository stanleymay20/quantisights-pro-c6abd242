name: Patch provider-native references

on:
  push:
    branches:
      - hardening/provider-native-references-20261017

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/provider-native-references-20261017
          fetch-depth: 0

      - name: Patch canonical executor fail-closed
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/execute-decision-action/index.ts")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Refusing patch: expected exactly one {label} match, found {count}")
              text = text.replace(old, new, 1)

          retry_import = '} from "./retry-policy.ts";\n'
          replace_once(
              retry_import,
              retry_import
              + 'import {\n'
              + '  extractSlackExternalReference,\n'
              + '  extractWebhookExternalReference,\n'
              + '} from "./provider-reference.ts";\n',
              "retry-policy import boundary",
          )

          webhook_response = '          const webhookResp = dispatch.response;\n'
          replace_once(
              webhook_response,
              webhook_response + '          const webhookReference = extractWebhookExternalReference(webhookResp.headers);\n',
              "webhook response",
          )

          webhook_receipt = (
              '            responseStatus: webhookResp.status,\n'
              '            responseMetadata: {\n'
              '              webhook_url,\n'
          )
          replace_once(
              webhook_receipt,
              '            responseStatus: webhookResp.status,\n'
              '            externalReference: webhookReference.externalReference,\n'
              '            responseMetadata: {\n'
              '              webhook_url,\n'
              '              provider_reference_header: webhookReference.sourceHeader,\n',
              "webhook receipt completion",
          )

          slack_outcome = '          const httpOutcome = classifyHttpOutcome(resp.status);\n'
          replace_once(
              slack_outcome,
              '          const externalReference = extractSlackExternalReference(data);\n' + slack_outcome,
              "Slack outcome classification",
          )

          slack_receipt = (
              '            responseStatus: resp.status,\n'
              '            responseMetadata: {\n'
              '              channel: normalizedChannel,\n'
          )
          replace_once(
              slack_receipt,
              '            responseStatus: resp.status,\n'
              '            externalReference,\n'
              '            responseMetadata: {\n'
              '              channel: normalizedChannel,\n'
              '              provider_reference_recorded: externalReference !== null,\n',
              "Slack receipt completion",
          )

          path.write_text(text)

      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/patch-provider-native-references.yml

      - name: Commit patched canonical executor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Execution: wire provider-native references"
          git push origin HEAD:hardening/provider-native-references-20261017
