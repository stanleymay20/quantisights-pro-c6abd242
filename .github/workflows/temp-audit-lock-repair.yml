name: Temporary audit lock repair

on:
  push:
    branches:
      - ga/auth-email-provider-preflight-20260901
    paths:
      - .github/workflows/temp-audit-lock-repair.yml

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor == 'stanleymay20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ga/auth-email-provider-preflight-20260901

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Generate and verify lockfile-only security repair
        run: |
          set -Eeuo pipefail
          npm ci
          git status --porcelain
          npm audit fix --package-lock-only --ignore-scripts --audit-level=moderate
          npm audit --audit-level=moderate
          git diff --exit-code -- package.json
          changed="$(git diff --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            echo "::error::Refusing repair because changed files are not exactly package-lock.json"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit verified lock repair
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix audited dependency vulnerabilities"
          git push origin HEAD:ga/auth-email-provider-preflight-20260901
