name: Cleanup One-Time Patch Files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-one-time-patches.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-one-time-patch-files
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-time files
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-diagnostics-nav-patch.yml \
            ops/patches/diagnostics-primary-nav.patch \
            .github/workflows/cleanup-one-time-patches.yml

      - name: Commit cleanup directly to main
        run: |
          git config user.name "quantivis-integrity-bot"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git commit -m "Remove one-time diagnostics patch machinery"
          git push origin HEAD:main
