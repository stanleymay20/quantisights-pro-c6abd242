name: Temporary controlled lockfile audit repair

on:
  push:
    branches:
      - docs/quantivis-unique-work-resolution
    paths:
      - .github/workflows/temporary-lockfile-audit-repair.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/quantivis-unique-work-resolution
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Verify exact remote head
        shell: bash
        run: |
          remote_head="$(git ls-remote origin refs/heads/docs/quantivis-unique-work-resolution | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Refusing stale write: remote=$remote_head run=$GITHUB_SHA" >&2
            exit 1
          }

      - name: Regenerate lock from reviewed security contract
        shell: bash
        run: |
          cp package.json /tmp/package.json.before
          npm install --package-lock-only --ignore-scripts --no-audit
          cmp -s package.json /tmp/package.json.before || {
            echo "Refusing package.json mutation" >&2
            git diff -- package.json >&2 || true
            exit 1
          }
          test -n "$(git diff -- package-lock.json)" || {
            echo "Expected package-lock.json to change" >&2
            exit 1
          }

      - name: Verify repaired dependency tree and audit
        shell: bash
        run: |
          rm -rf node_modules
          npm ci
          npm ls @humanfs/node @vitest/mocker fflate js-yaml vitest --all
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const checks = [
            ['node_modules/@humanfs/node', v => v === '0.16.8'],
            ['node_modules/js-yaml', v => v === '4.3.2'],
            ['node_modules/fflate', v => v === '0.8.3'],
            ['node_modules/posthog-js/node_modules/fflate', v => v === '0.4.9'],
            ['node_modules/vitest', v => {
              const [major, minor, patch] = v.split('.').map(Number);
              return major === 4 && (minor > 1 || (minor === 1 && patch >= 11));
            }],
            ['node_modules/@vitest/mocker', v => {
              const [major, minor, patch] = v.split('.').map(Number);
              return major === 4 && (minor > 1 || (minor === 1 && patch >= 11));
            }],
          ];
          for (const [path, ok] of checks) {
            const version = packages[path]?.version;
            if (!version || !ok(version)) {
              console.error(`Unsafe resolution ${path}: ${version ?? 'missing'}`);
              process.exit(1);
            }
            console.log(`${path} -> ${version}`);
          }
          NODE
          npm audit --audit-level=moderate
          git diff --check

      - name: Commit only repaired lockfile and remove temporary writer
        shell: bash
        run: |
          remote_head="$(git ls-remote origin refs/heads/docs/quantivis-unique-work-resolution | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Refusing stale write before commit: remote=$remote_head run=$GITHUB_SHA" >&2
            exit 1
          }
          rm .github/workflows/temporary-lockfile-audit-repair.yml
          git add package-lock.json .github/workflows/temporary-lockfile-audit-repair.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temporary-lockfile-audit-repair.yml' 'package-lock.json' | sort)"
          test "$changed" = "$expected" || {
            echo "Refusing unexpected staged paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name "quantivis-lockfile-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh vulnerable dependency resolutions"
          git push origin HEAD:docs/quantivis-unique-work-resolution
