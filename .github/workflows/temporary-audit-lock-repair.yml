name: Temporary audit lock repair

on:
  push:
    branches:
      - ga/auth-email-provider-preflight-20260901

permissions:
  contents: write

concurrency:
  group: temporary-audit-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor == 'stanleymay20' && github.ref == 'refs/heads/ga/auth-email-provider-preflight-20260901' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ga/auth-email-provider-preflight-20260901
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Generate and verify lockfile-only repair
        id: repair
        run: |
          set -Eeuo pipefail
          if npm audit --audit-level=moderate >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependency audit already clean; no lockfile repair required."
            exit 0
          fi

          cp package.json /tmp/package.before.json
          npm audit fix --package-lock-only --ignore-scripts --audit-level=moderate
          cmp -s package.json /tmp/package.before.json || {
            echo "::error::npm audit fix modified package.json; refusing branch write"
            exit 1
          }
          npm audit --audit-level=moderate

          changed="$(git diff --name-only)"
          if [ "$changed" != "package-lock.json" ]; then
            echo "::error::Refusing branch write because changed files are not exactly package-lock.json"
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit verified lockfile repair to this branch only
        if: ${{ steps.repair.outputs.changed == 'true' }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" != "refs/heads/ga/auth-email-provider-preflight-20260901" ]; then
            echo "::error::Refusing to write any branch other than the audited PR branch"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix audited transitive dependency vulnerabilities"
          git push origin HEAD:ga/auth-email-provider-preflight-20260901
