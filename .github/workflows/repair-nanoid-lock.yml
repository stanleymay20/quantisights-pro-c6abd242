name: Repair Nanoid Lock

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.ref == 'agent/trust-critical-current-main-iteration-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Repair audited lock resolution
        run: npm audit fix --package-lock-only

      - name: Verify Nanoid is no longer vulnerable
        run: npm audit --audit-level=moderate

      - name: Commit regenerated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix audited nanoid lock resolution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
