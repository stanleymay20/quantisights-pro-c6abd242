name: Apply connector tenant invocation guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_pilot-connector-auth-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Patch Salesforce tenant invocation auth
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/connector-salesforce-pull/index.ts')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { shouldAllow, recordSuccess, recordFailure, deadLetter } from "../_shared/connector-isolation.ts";\n',
              'import { shouldAllow, recordSuccess, recordFailure, deadLetter } from "../_shared/connector-isolation.ts";\n'
              'import { authorizeConnectorInvocation } from "../_shared/connector-invocation-auth.ts";\n'
          )

          replace_once(
              '    const orgId = connector.organization_id;\n'
              '    const cfg = (connector.config ?? {}) as { mode?: Mode; objects?: unknown; governance?: SoqlGovernance };\n',
              '    const orgId = connector.organization_id;\n\n'
              '    const authHeader = req.headers.get("authorization");\n'
              '    const anonKey = Deno.env.get("SUPABASE_ANON_KEY");\n'
              '    const userClient = anonKey\n'
              '      ? createClient(supabaseUrl, anonKey, { global: { headers: { Authorization: authHeader ?? "" } } })\n'
              '      : null;\n'
              '    const invocation = await authorizeConnectorInvocation({\n'
              '      authHeader,\n'
              '      serviceRoleKey,\n'
              '      organizationId: orgId,\n'
              '      userClient,\n'
              '      membershipClient: svc,\n'
              '    });\n'
              '    if (!invocation.allowed) {\n'
              '      return json({ error: invocation.reason === "forbidden" ? "Forbidden" : "Unauthorized" }, invocation.status, cors);\n'
              '    }\n\n'
              '    const cfg = (connector.config ?? {}) as { mode?: Mode; objects?: unknown; governance?: SoqlGovernance };\n'
          )

          path.write_text(text)
          PY
      - name: Commit guarded connector and self-clean
        run: |
          rm .github/workflows/_pilot-connector-auth-patch.yml
          git config user.name "quantivis-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/connector-salesforce-pull/index.ts .github/workflows/_pilot-connector-auth-patch.yml
          git commit -m "Enforce Salesforce connector tenant membership"
          git push origin main
