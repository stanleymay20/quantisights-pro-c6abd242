name: Apply Cloudflare Security Headers

on:
  workflow_dispatch: {}

concurrency:
  group: cloudflare-security-headers
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::error::CLOUDFLARE_ZONE_ID is not set"
            exit 1
          fi

      - name: Apply Cloudflare security headers
        run: npm run cloudflare:apply

      - name: Apply Cloudflare Worker security header fallback
        run: npm run cloudflare:apply-worker

      - name: Wait for edge propagation
        run: sleep 20

      - name: Verify live security headers
        run: npm run cloudflare:verify
