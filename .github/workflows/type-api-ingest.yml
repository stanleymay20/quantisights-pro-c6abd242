name: Type API Ingest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/type-api-ingest.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Harden API ingest typing and JWT tenant membership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/api-ingest/index.ts")
          text = path.read_text()

          if not text.startswith("// @ts-nocheck\n"):
              raise SystemExit("api-ingest no longer has expected ts-nocheck marker")
          text = text.removeprefix("// @ts-nocheck\n")
          text = text.replace(
              '    const anonKey = Deno.env.get("SUPABASE_ANON_KEY")!;\n'
              '    const userClient = createClient(supabaseUrl, anonKey, {\n'
              '      global: { headers: { Authorization: authHeader } },\n'
              '    }) as any;\n',
              '    const anonKey = Deno.env.get("SUPABASE_ANON_KEY");\n'
              '    if (!anonKey) throw new Error("Supabase auth configuration unavailable");\n'
              '    const userClient = createClient(supabaseUrl, anonKey, {\n'
              '      global: { headers: { Authorization: authHeader } },\n'
              '    });\n',
              1,
          )

          profile_anchor = (
              '    if (!profile?.organization_id) {\n'
              '      throw new Error("Organization not found for user");\n'
              '    }\n\n'
          )
          membership = (
              '    if (!profile?.organization_id) {\n'
              '      throw new Error("Organization not found for user");\n'
              '    }\n\n'
              '    const { data: membership } = await svc\n'
              '      .from("organization_members")\n'
              '      .select("role")\n'
              '      .eq("organization_id", profile.organization_id)\n'
              '      .eq("user_id", user.id)\n'
              '      .maybeSingle();\n'
              '    if (!membership) {\n'
              '      throw new Error("User is not a member of organization");\n'
              '    }\n\n'
          )
          if profile_anchor not in text:
              raise SystemExit("profile organization anchor not found")
          text = text.replace(profile_anchor, membership, 1)

          old_start = (
              'serve(async (req) => {\n'
              '  if (req.method === "OPTIONS") return corsPreflightResponse(req);\n'
              '  const corsHeaders = getCorsHeaders(req);\n'
              '  const logger = createLogger("api-ingest", req);\n\n'
              '  const startTime = Date.now();\n'
              '  const supabaseUrl = Deno.env.get("SUPABASE_URL")!;\n'
              '  const serviceKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!;\n'
              '  const svc = createClient(supabaseUrl, serviceKey) as any;\n\n'
              '  const respond = (body: unknown, status = 200) =>\n'
              '    new Response(JSON.stringify(body), { status, headers: { ...corsHeaders, "Content-Type": "application/json" } });\n\n'
          )
          new_start = (
              'serve(async (req: Request) => {\n'
              '  if (req.method === "OPTIONS") return corsPreflightResponse(req);\n'
              '  const corsHeaders = getCorsHeaders(req);\n'
              '  const logger = createLogger("api-ingest", req);\n'
              '  const respond = (body: unknown, status = 200) =>\n'
              '    new Response(JSON.stringify(body), { status, headers: { ...corsHeaders, "Content-Type": "application/json" } });\n\n'
              '  const startTime = Date.now();\n'
              '  const supabaseUrl = Deno.env.get("SUPABASE_URL");\n'
              '  const serviceKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n'
              '  if (!supabaseUrl || !serviceKey) {\n'
              '    logger.error("missing required Supabase environment configuration");\n'
              '    return respond({ error: "API ingestion service unavailable" }, 503);\n'
              '  }\n'
              '  const svc = createClient(supabaseUrl, serviceKey);\n\n'
          )
          if old_start not in text:
              raise SystemExit("api-ingest service-client anchor not found")
          text = text.replace(old_start, new_start, 1)

          old_catch = (
              '    return respond({ error: message }, [\n'
              '      "Invalid authorization token",\n'
              '      "Invalid API key",\n'
              '      "Authorization header or x-api-key required",\n'
              '      "Organization not found for user",\n'
              '      "x-dataset-id not found for organization",\n'
              '    ].includes(message) ? 401 : 500);\n'
          )
          new_catch = (
              '    const status = [\n'
              '      "Invalid authorization token",\n'
              '      "Invalid API key",\n'
              '      "Authorization header or x-api-key required",\n'
              '    ].includes(message)\n'
              '      ? 401\n'
              '      : ["Organization not found for user", "User is not a member of organization"].includes(message)\n'
              '        ? 403\n'
              '        : message === "x-dataset-id not found for organization"\n'
              '          ? 400\n'
              '          : 500;\n'
              '    return respond({ error: message }, status);\n'
          )
          if old_catch not in text:
              raise SystemExit("api-ingest error mapping anchor not found")
          text = text.replace(old_catch, new_catch, 1)

          if " as any" in text:
              raise SystemExit("api-ingest still contains as any after patch")
          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/type-api-ingest.yml

      - name: Commit directly to main
        run: |
          git config user.name "quantivis-integrity-bot"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add supabase/functions/api-ingest/index.ts
          git commit -m "Type API ingest tenant boundary"
          git push origin HEAD:main
