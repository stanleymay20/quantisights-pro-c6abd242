name: Dependency Repair Diagnostic

on:
  push:
    branches:
      - security/dependency-audit-20261016

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply candidate dependency repair in workspace
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete p.devDependencies['lovable-tagger'];
          delete p.devDependencies['@tailwindcss/typography'];
          p.devDependencies['typescript-eslint'] = '8.71.2';
          p.devDependencies['braces'] = 'file:vendor/braces-patched';
          p.overrides ||= {};
          p.overrides.braces = '$braces';
          p.overrides['source-map-js'] = '1.2.2';
          p.overrides.dompurify = '3.4.16';
          p.overrides['postcss-selector-parser'] = '7.1.6';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vite.config.ts')
          s = path.read_text()
          s = s.replace('import { componentTagger } from "lovable-tagger";\n', '')
          s = s.replace('releaseProvenancePlugin(releaseMetadata), react(), mode === "development" && componentTagger()', 'releaseProvenancePlugin(releaseMetadata), react()')
          path.write_text(s)
          PY

      - name: Regenerate lock with repository npm
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts

      - name: Install exact candidate graph
        run: npm ci

      - name: Prove patched braces resolution
        run: |
          set -Eeuo pipefail
          node -e "const p=require('braces/package.json'); if(p.version!=='3.0.4-quantivis.1') throw new Error('wrong braces version '+p.version); console.log(p.version)"
          if npm ls braces --all | grep -E 'braces@3\.0\.3($|[^-])'; then
            echo 'Unpatched braces remains in dependency graph' >&2
            exit 1
          fi
          npm ls braces --all
          npx vitest run src/test/patched-braces-security.test.ts

      - name: Audit repaired dependency graph
        run: npm audit --audit-level=moderate

      - name: Full repository release gate
        run: npm run release-gate

      - name: Capture candidate evidence
        if: always()
        run: |
          set +e
          mkdir -p artifacts/dependency-diagnostic
          cp package.json package-lock.json vite.config.ts artifacts/dependency-diagnostic/
          npm ls braces chokidar micromatch fast-glob postcss-selector-parser source-map-js dompurify typescript-eslint tailwindcss tailwindcss-animate --all --json > artifacts/dependency-diagnostic/npm-ls.json 2> artifacts/dependency-diagnostic/npm-ls.stderr
          npm audit --json > artifacts/dependency-diagnostic/npm-audit.json 2> artifacts/dependency-diagnostic/npm-audit.stderr
          npm audit --audit-level=moderate > artifacts/dependency-diagnostic/npm-audit.txt 2>&1
          echo $? > artifacts/dependency-diagnostic/npm-audit-exit-code.txt
          git diff -- package.json package-lock.json vite.config.ts > artifacts/dependency-diagnostic/candidate.diff
          set -e

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-repair-candidate-${{ github.sha }}
          path: artifacts/dependency-diagnostic/
          if-no-files-found: error
          retention-days: 2
