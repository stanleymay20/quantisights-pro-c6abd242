name: Dependency Repair Diagnostic

on:
  push:
    branches:
      - security/dependency-audit-20261016

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Generate candidate lock with newer npm
        run: |
          set -Eeuo pipefail
          npm pkg delete "devDependencies.@tailwindcss/typography"
          npm pkg set \
            "devDependencies.typescript-eslint=8.71.2" \
            "devDependencies.postcss=8.5.30" \
            "devDependencies.lovable-tagger=1.3.5" \
            "devDependencies.tailwindcss=4.3.3" \
            "devDependencies.@tailwindcss/postcss=4.3.3" \
            "dependencies.posthog-js=1.438.12"
          rm -rf node_modules package-lock.json
          npx --yes npm@11 install --package-lock-only --ignore-scripts

      - name: Capture candidate dependency evidence
        run: |
          set +e
          mkdir -p artifacts/dependency-diagnostic
          cp package.json package-lock.json artifacts/dependency-diagnostic/
          npx --yes npm@11 ls braces chokidar micromatch fast-glob postcss-selector-parser source-map-js dompurify typescript-eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin @typescript-eslint/typescript-estree tailwindcss @tailwindcss/postcss lovable-tagger posthog-js --all --json > artifacts/dependency-diagnostic/npm-ls.json 2> artifacts/dependency-diagnostic/npm-ls.stderr
          npx --yes npm@11 audit --json > artifacts/dependency-diagnostic/npm-audit.json 2> artifacts/dependency-diagnostic/npm-audit.stderr
          npx --yes npm@11 audit --audit-level=moderate > artifacts/dependency-diagnostic/npm-audit.txt 2>&1
          echo $? > artifacts/dependency-diagnostic/npm-audit-exit-code.txt
          set -e

      - name: Validate generated lock with npm 11
        run: npx --yes npm@11 ci

      - name: Record npm 10 compatibility
        if: always()
        run: |
          set +e
          npm ci > artifacts/dependency-diagnostic/npm10-ci.txt 2>&1
          echo $? > artifacts/dependency-diagnostic/npm10-ci-exit-code.txt
          set -e

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-repair-candidate-${{ github.sha }}
          path: artifacts/dependency-diagnostic/
          if-no-files-found: error
          retention-days: 2
