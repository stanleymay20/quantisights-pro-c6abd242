name: Deploy Supabase

# Applies database migrations and then deploys all Edge Functions to the linked
# Supabase project on every relevant push to main.
#
# Why this exists:
#   Lovable's auto-deploy reliably triggers for edge-function files edited
#   through the Lovable agent session, but external `git push origin main`
#   commits (from local IDEs, other tooling, etc.) have been observed to land
#   in the repo without the corresponding edge function being redeployed.
#   This workflow closes that gap with an explicit, visible deploy step and
#   produces a deploy log you can inspect in the Actions tab.
#
# Required GitHub Actions secrets (Repo Settings -> Secrets and variables -> Actions):
#   - SUPABASE_ACCESS_TOKEN   Personal access token from
#                             https://supabase.com/dashboard/account/tokens
#   - SUPABASE_DB_PASSWORD    Project database password used by db push
#
# Notes:
#   - Database migrations are applied before functions so code never depends on
#     a schema version that has not reached production.
#   - This deploys ALL functions every run. It is simpler and safer than
#     diff-based selective deploys, and the Supabase CLI is fast enough
#     (~1-2 minutes for ~120 functions). If you later want changed-only
#     deploys, replace the loop with a `git diff --name-only` filter.
#   - `_shared` is skipped (it's a shared lib, not a deployable function).
#   - No `--no-verify-jwt` flag is passed. Each function's verify_jwt setting
#     is taken from supabase/config.toml when present, or the platform default
#     (verify_jwt = true) when absent. Passing the CLI flag would override
#     config.toml at deploy time and silently flip protected functions.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: itpwpnwzzitkelffttyx
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.58.5

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all edge functions
        run: |
          set -euo pipefail
          shopt -s nullglob

          deployed=0
          failed=0
          failed_names=()

          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"

            # Skip shared lib and any folder without an index.ts
            if [ "$name" = "_shared" ]; then continue; fi
            if [ ! -f "${dir}index.ts" ]; then continue; fi

            echo "::group::Deploying $name"
            if supabase functions deploy "$name" \
                 --project-ref "$SUPABASE_PROJECT_REF"; then
              deployed=$((deployed + 1))
              echo "::endgroup::"
            else
              failed=$((failed + 1))
              failed_names+=("$name")
              echo "::endgroup::"
              echo "::error::Deploy failed for $name"
            fi
          done

          echo ""
          echo "===================="
          echo "Deployed: $deployed"
          echo "Failed:   $failed"
          if [ "$failed" -gt 0 ]; then
            echo "Failed functions: ${failed_names[*]}"
            exit 1
          fi
