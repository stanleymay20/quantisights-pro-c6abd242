name: Deploy Supabase Production

# Production promotion is deliberately manual. Configure the `production`
# GitHub Environment with required reviewers and environment-scoped secrets:
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
#
# The exact commit being promoted must pass the repository release gate in this
# workflow before any production migration or Edge Function deployment begins.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Type the production project reference to confirm deployment
        required: true
        type: string

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: itpwpnwzzitkelffttyx
    steps:
      - name: Confirm production target
        env:
          CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          if [ "$CONFIRMED_PROJECT_REF" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Production project confirmation did not match"
            exit 1
          fi

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::production environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::production environment secret SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run full production release gate
        run: npm run release-gate

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.58.5

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview production migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply production migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify production migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy production Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --jobs 4

      - name: Verify production Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
