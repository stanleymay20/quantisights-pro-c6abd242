name: Deploy Supabase Production

# Production promotion is deliberately manual. Configure the `production`
# GitHub Environment with required reviewers and environment-scoped secrets:
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
# The requested release SHA must match the run-scoped proof artifact from a
# successful GA Readiness run. That proof must carry successful client-
# acceptance and tenant-isolation provenance for the same immutable SHA before
# any production database or Edge mutation.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA that passed all GA gates
        required: true
        type: string
      ga_readiness_run_id:
        description: Successful GA Readiness run ID whose proof certifies release_sha
        required: true
        type: string
      confirm_project_ref:
        description: Type the production project reference to confirm deployment
        required: true
        type: string

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: izgfrekdamlgigehxoqs
      RELEASE_SHA: ${{ inputs.release_sha }}
      GA_READINESS_RUN_ID: ${{ inputs.ga_readiness_run_id }}
      SUPABASE_FUNCTION_DEPLOY_MAX_ATTEMPTS: "5"
      SUPABASE_FUNCTION_DEPLOY_BASE_DELAY_SECONDS: "5"
      SUPABASE_FUNCTION_DEPLOY_PACE_SECONDS: "2"
    steps:
      - name: Confirm production target and release SHA
        env:
          CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          if [ "$CONFIRMED_PROJECT_REF" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Production project confirmation did not match"
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::release_sha must be a full 40-character Git commit SHA"
            exit 1
          fi
          if ! [[ "$GA_READINESS_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::ga_readiness_run_id must be a numeric workflow run ID"
            exit 1
          fi

      - name: Download GA certification proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ga-readiness-proof
          path: artifacts/ga-readiness-source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ga_readiness_run_id }}

      - name: Verify run-scoped GA certification proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          proof="artifacts/ga-readiness-source/proof.json"
          test -s "$proof"
          proof_sha="$(jq -r '.certified_sha // empty' "$proof")"
          proof_run_id="$(jq -r '.ga_readiness_run_id // empty' "$proof")"
          client_acceptance_run_id="$(jq -r '.client_acceptance_run_id // empty' "$proof")"
          ga_staging_run_id="$(jq -r '.ga_staging_run_id // empty' "$proof")"
          if [ "$proof_sha" != "$RELEASE_SHA" ]; then
            echo "::error::GA certification proof SHA does not match requested release_sha"
            exit 1
          fi
          if [ "$proof_run_id" != "$GA_READINESS_RUN_ID" ]; then
            echo "::error::GA certification proof run ID does not match selected GA Readiness run"
            exit 1
          fi
          if ! [[ "$client_acceptance_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GA certification proof is missing client-acceptance provenance"
            exit 1
          fi
          if ! [[ "$ga_staging_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GA certification proof is missing its staging-validation provenance"
            exit 1
          fi

          verify_run() {
            local run_id="$1" expected_path="$2" label="$3" payload
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if [ "$(jq -r '.path // empty' <<<"$payload")" != "$expected_path" ] \
              || [ "$(jq -r '.status // empty' <<<"$payload")" != "completed" ] \
              || [ "$(jq -r '.conclusion // empty' <<<"$payload")" != "success" ]; then
              echo "::error::Run ${run_id} is not a successful ${label} run"
              exit 1
            fi
          }

          verify_run "$GA_READINESS_RUN_ID" ".github/workflows/ga-readiness.yml" "GA Readiness"
          verify_run "$client_acceptance_run_id" ".github/workflows/client-acceptance.yml" "Client Acceptance"
          verify_run "$ga_staging_run_id" ".github/workflows/ga-staging-validation.yml" "GA Staging Validation"

      - name: Verify exact-SHA CI and staging deployment gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          require_gate() {
            local workflow="$1" label="$2" attempt payload matching status conclusion run_id
            for attempt in $(seq 1 12); do
              payload="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100")"
              matching="$(jq -c --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0] // empty' <<<"$payload")"
              if [ -z "$matching" ]; then
                if [ "$attempt" -lt 12 ]; then sleep 10; continue; fi
                echo "::error::No ${label} run found for ${RELEASE_SHA}"; exit 1
              fi
              status="$(jq -r '.status' <<<"$matching")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$matching")"
              run_id="$(jq -r '.id' <<<"$matching")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::${label} run ${run_id} for ${RELEASE_SHA} concluded ${conclusion}"; exit 1
                fi
                echo "Verified ${label} run ${run_id} for ${RELEASE_SHA}"; return 0
              fi
              if [ "$attempt" -lt 12 ]; then sleep 10; fi
            done
            echo "::error::${label} did not complete successfully for ${RELEASE_SHA}"; exit 1
          }
          require_gate "ci.yml" "CI"
          require_gate "deploy-supabase-staging.yml" "Deploy Supabase Staging"

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::production environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::production environment secret SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi

      - name: Checkout certified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify checked-out release
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match requested release $RELEASE_SHA"
            exit 1
          fi
          echo "Promoting certified release $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run full production release gate
        run: npm run release-gate

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.58.5

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview production migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply production migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify production migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy production Edge Functions
        run: bash scripts/deploy-supabase-functions-resilient.sh

      - name: Verify production Edge Functions
        run: bash scripts/verify-supabase-functions.sh

      - name: Verify live GA security baseline
        run: node scripts/verify-live-ga-security.mjs
