name: Apply Diagnostics Navigation Patch

on:
  push:
    branches: [main]
    paths:
      - "ops/patches/diagnostics-primary-nav.patch"

permissions:
  contents: write

concurrency:
  group: apply-diagnostics-nav-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited patch
        run: git apply --check ops/patches/diagnostics-primary-nav.patch && git apply ops/patches/diagnostics-primary-nav.patch

      - name: Commit directly to main
        run: |
          git config user.name "quantivis-integrity-bot"
          git config user.email "107648937+stanleymay20@users.noreply.github.com"
          git add src/components/dashboard/DashboardSidebar.tsx
          git commit -m "Promote diagnostics into primary operations navigation"
          git push origin HEAD:main
