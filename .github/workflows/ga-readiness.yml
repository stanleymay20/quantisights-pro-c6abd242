name: GA Readiness

# Heavy GA certification is chained behind real staging validation. The exact
# SHA comes from a run-scoped tenant-isolation proof artifact, not from the
# GA Staging Validation workflow's top-level head_sha (which may point at a
# newer default-branch commit). A successful certification publishes its own
# proof artifact for the manual production promotion gate.

on:
  workflow_run:
    workflows: ["GA Staging Validation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA that already passed staging validation
        required: true
        type: string
      ga_staging_run_id:
        description: Successful GA Staging Validation run ID whose proof certifies release_sha
        required: true
        type: string

concurrency:
  group: ga-readiness-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ga_staging_run_id }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      QV_CERTIFY_REPORT: ${{ github.workspace }}/artifacts/quantivis-certification-report.md
    steps:
      - name: Resolve staging-validation evidence run
        id: staging_evidence
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ga_staging_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::GA certification requires a numeric GA Staging Validation run ID"
            exit 1
          fi
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "GA_STAGING_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Download exact staging-validation proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ga-staging-validation-proof
          path: artifacts/ga-staging-source
          github-token: ${{ github.token }}
          run-id: ${{ steps.staging_evidence.outputs.run_id }}

      - name: Resolve certified SHA from tenant-isolation proof
        env:
          MANUAL_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          proof="artifacts/ga-staging-source/proof.json"
          test -s "$proof"
          certified_sha="$(jq -r '.validated_sha // empty' "$proof")"
          proof_run_id="$(jq -r '.staging_validation_run_id // empty' "$proof")"
          if ! [[ "$certified_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Tenant-isolation proof does not contain a full validated SHA"
            exit 1
          fi
          if [ "$proof_run_id" != "$GA_STAGING_RUN_ID" ]; then
            echo "::error::Tenant-isolation proof run ID does not match its source workflow run"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$certified_sha" != "$MANUAL_SHA" ]; then
            echo "::error::Requested release_sha does not match the selected tenant-isolation proof"
            exit 1
          fi
          echo "CERTIFIED_SHA=$certified_sha" >> "$GITHUB_ENV"
          echo "Certifying tenant-isolation-proven release $certified_sha"

      - name: Verify staging-validation source run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GA_STAGING_RUN_ID}")"
          path="$(jq -r '.path // empty' <<<"$payload")"
          status="$(jq -r '.status // empty' <<<"$payload")"
          conclusion="$(jq -r '.conclusion // empty' <<<"$payload")"
          if [ "$path" != ".github/workflows/ga-staging-validation.yml" ] || [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Run ${GA_STAGING_RUN_ID} is not a successful GA Staging Validation run"
            exit 1
          fi

      - name: Verify exact-SHA prerequisite workflow gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          wait_for_gate() {
            local workflow="$1" label="$2" attempt payload matching status conclusion run_id
            for attempt in $(seq 1 30); do
              payload="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100")"
              matching="$(jq -c --arg sha "$CERTIFIED_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0] // empty' <<<"$payload")"
              if [ -z "$matching" ]; then
                if [ "$attempt" -lt 30 ]; then sleep 10; continue; fi
                echo "::error::No ${label} run found for ${CERTIFIED_SHA}"; exit 1
              fi
              status="$(jq -r '.status' <<<"$matching")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$matching")"
              run_id="$(jq -r '.id' <<<"$matching")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::${label} run ${run_id} for ${CERTIFIED_SHA} concluded ${conclusion}"; exit 1
                fi
                echo "Verified ${label} run ${run_id} for ${CERTIFIED_SHA}"; return 0
              fi
              if [ "$attempt" -lt 30 ]; then sleep 10; fi
            done
            echo "::error::${label} did not complete successfully for ${CERTIFIED_SHA} within the verification window"; exit 1
          }
          wait_for_gate "ci.yml" "CI"
          wait_for_gate "deploy-supabase-staging.yml" "Deploy Supabase Staging"

      - name: Checkout certified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          persist-credentials: false

      - name: Verify checked-out certification target
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$CERTIFIED_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match certification target $CERTIFIED_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release scripts
        run: |
          bash -n scripts/deploy-supabase-functions-resilient.sh
          bash -n scripts/verify-supabase-functions.sh
          node --check scripts/verify-live-ga-security.mjs

      - name: Prepare certification output
        run: mkdir -p artifacts

      - name: Run official GA release gate
        run: npm run release-gate

      - name: Verify certification report
        run: |
          test -s "$QV_CERTIFY_REPORT"
          echo "Certification report generated at $QV_CERTIFY_REPORT"
          cat "$QV_CERTIFY_REPORT"

      - name: Verify evidence documentation parity
        run: npm run evidence:docs

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Verify live GA security baseline
        run: node scripts/verify-live-ga-security.mjs

      - name: Record GA certification proof
        run: |
          mkdir -p artifacts/ga-readiness-proof
          jq -n \
            --arg certified_sha "$CERTIFIED_SHA" \
            --arg ga_staging_run_id "$GA_STAGING_RUN_ID" \
            --arg ga_readiness_run_id "$GITHUB_RUN_ID" \
            '{certified_sha: $certified_sha, ga_staging_run_id: $ga_staging_run_id, ga_readiness_run_id: $ga_readiness_run_id}' \
            > artifacts/ga-readiness-proof/proof.json
          printf '%s\n' "$CERTIFIED_SHA" > artifacts/ga-readiness-proof/certified-sha.txt
          cp "$QV_CERTIFY_REPORT" artifacts/ga-readiness-proof/quantivis-certification-report.md

      - name: Publish GA certification proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ga-readiness-proof
          path: artifacts/ga-readiness-proof
          if-no-files-found: error
          retention-days: 90
