name: GA Readiness

# Heavy GA certification is chained behind a real client-acceptance review.
# The exact SHA comes from a run-scoped Client Acceptance proof, which itself
# carries the successful tenant-isolation staging provenance. A successful GA
# certification publishes its own proof for the manual production promotion gate.

on:
  workflow_run:
    workflows: ["Client Acceptance"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA that already passed client acceptance
        required: true
        type: string
      client_acceptance_run_id:
        description: Successful Client Acceptance run ID whose proof certifies release_sha
        required: true
        type: string

concurrency:
  group: ga-readiness-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.client_acceptance_run_id }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      QV_CERTIFY_REPORT: ${{ github.workspace }}/artifacts/quantivis-certification-report.md
    steps:
      - name: Resolve client-acceptance evidence run
        id: client_evidence
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.client_acceptance_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::GA certification requires a numeric Client Acceptance run ID"
            exit 1
          fi
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "CLIENT_ACCEPTANCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Download exact client-acceptance proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-acceptance-proof
          path: artifacts/client-acceptance-source
          github-token: ${{ github.token }}
          run-id: ${{ steps.client_evidence.outputs.run_id }}

      - name: Resolve certified SHA from client proof
        env:
          MANUAL_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          proof="artifacts/client-acceptance-source/proof.json"
          test -s "$proof"
          certified_sha="$(jq -r '.validated_sha // empty' "$proof")"
          client_run_id="$(jq -r '.client_acceptance_run_id // empty' "$proof")"
          ga_staging_run_id="$(jq -r '.ga_staging_run_id // empty' "$proof")"
          if ! [[ "$certified_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Client-acceptance proof does not contain a full validated SHA"
            exit 1
          fi
          if [ "$client_run_id" != "$CLIENT_ACCEPTANCE_RUN_ID" ]; then
            echo "::error::Client-acceptance proof run ID does not match its source workflow run"
            exit 1
          fi
          if ! [[ "$ga_staging_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Client-acceptance proof is missing tenant-isolation provenance"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$certified_sha" != "$MANUAL_SHA" ]; then
            echo "::error::Requested release_sha does not match the selected client-acceptance proof"
            exit 1
          fi
          echo "CERTIFIED_SHA=$certified_sha" >> "$GITHUB_ENV"
          echo "GA_STAGING_RUN_ID=$ga_staging_run_id" >> "$GITHUB_ENV"
          echo "Certifying client-reviewed release $certified_sha"

      - name: Verify client-acceptance and staging-validation source runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          verify_run() {
            local run_id="$1" expected_path="$2" label="$3" payload
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if [ "$(jq -r '.path // empty' <<<"$payload")" != "$expected_path" ] \
              || [ "$(jq -r '.status // empty' <<<"$payload")" != "completed" ] \
              || [ "$(jq -r '.conclusion // empty' <<<"$payload")" != "success" ]; then
              echo "::error::Run ${run_id} is not a successful ${label} run"
              exit 1
            fi
          }
          verify_run "$CLIENT_ACCEPTANCE_RUN_ID" ".github/workflows/client-acceptance.yml" "Client Acceptance"
          verify_run "$GA_STAGING_RUN_ID" ".github/workflows/ga-staging-validation.yml" "GA Staging Validation"

      - name: Verify exact-SHA prerequisite workflow gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          wait_for_gate() {
            local workflow="$1" label="$2" attempt payload matching_success matching_active latest_terminal status conclusion run_id
            for attempt in $(seq 1 30); do
              payload="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100")"

              matching_success="$(jq -c --arg sha "$CERTIFIED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.run_attempt // 0, .id) | last // empty' <<<"$payload")"
              if [ -n "$matching_success" ]; then
                run_id="$(jq -r '.id' <<<"$matching_success")"
                echo "Verified ${label} run ${run_id} for ${CERTIFIED_SHA}"
                return 0
              fi

              matching_active="$(jq -c --arg sha "$CERTIFIED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status != "completed")] | sort_by(.run_attempt // 0, .id) | last // empty' <<<"$payload")"
              if [ -n "$matching_active" ]; then
                if [ "$attempt" -lt 30 ]; then sleep 10; continue; fi
                run_id="$(jq -r '.id' <<<"$matching_active")"
                echo "::error::${label} run ${run_id} for ${CERTIFIED_SHA} did not complete successfully within the verification window"
                exit 1
              fi

              latest_terminal="$(jq -c --arg sha "$CERTIFIED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | sort_by(.run_attempt // 0, .id) | last // empty' <<<"$payload")"
              if [ -n "$latest_terminal" ]; then
                status="$(jq -r '.status' <<<"$latest_terminal")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$latest_terminal")"
                run_id="$(jq -r '.id' <<<"$latest_terminal")"
                echo "::error::No successful ${label} run exists for ${CERTIFIED_SHA}; latest completed run ${run_id} concluded ${conclusion}"
                exit 1
              fi

              if [ "$attempt" -lt 30 ]; then sleep 10; continue; fi
              echo "::error::No ${label} run found for ${CERTIFIED_SHA}"
              exit 1
            done
          }
          wait_for_gate "ci.yml" "CI"
          wait_for_gate "deploy-supabase-staging.yml" "Deploy Supabase Staging"

      - name: Checkout certified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          persist-credentials: false

      - name: Verify checked-out certification target
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$CERTIFIED_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match certification target $CERTIFIED_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release scripts
        run: |
          bash -n scripts/deploy-supabase-functions-resilient.sh
          bash -n scripts/verify-supabase-functions.sh
          node --check scripts/verify-live-ga-security.mjs

      - name: Prepare certification output
        run: mkdir -p artifacts

      - name: Run official GA release gate
        run: npm run release-gate

      - name: Verify certification report
        run: |
          test -s "$QV_CERTIFY_REPORT"
          echo "Certification report generated at $QV_CERTIFY_REPORT"
          cat "$QV_CERTIFY_REPORT"

      - name: Verify evidence documentation parity
        run: npm run evidence:docs

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Verify live GA security baseline
        run: node scripts/verify-live-ga-security.mjs

      - name: Record GA certification proof
        run: |
          mkdir -p artifacts/ga-readiness-proof
          jq -n \
            --arg certified_sha "$CERTIFIED_SHA" \
            --arg ga_staging_run_id "$GA_STAGING_RUN_ID" \
            --arg client_acceptance_run_id "$CLIENT_ACCEPTANCE_RUN_ID" \
            --arg ga_readiness_run_id "$GITHUB_RUN_ID" \
            '{certified_sha: $certified_sha, ga_staging_run_id: $ga_staging_run_id, client_acceptance_run_id: $client_acceptance_run_id, ga_readiness_run_id: $ga_readiness_run_id}' \
            > artifacts/ga-readiness-proof/proof.json
          printf '%s\n' "$CERTIFIED_SHA" > artifacts/ga-readiness-proof/certified-sha.txt
          cp "$QV_CERTIFY_REPORT" artifacts/ga-readiness-proof/quantivis-certification-report.md

      - name: Publish GA certification proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ga-readiness-proof
          path: artifacts/ga-readiness-proof
          if-no-files-found: error
          retention-days: 90
