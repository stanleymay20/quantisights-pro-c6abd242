name: Deploy Supabase Staging

# Staging is a downstream gate of successful CI for the exact main-branch SHA.
# This prevents push-triggered staging runs from racing or certifying commits whose
# CI has failed or has not completed. Manual dispatch remains available for an
# explicitly selected current SHA.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
      AUTH_SITE_URL: https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app
      AUTH_URI_ALLOW_LIST: https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/auth/callback,https://quantivis-insights.lovable.app/auth/callback,https://id-preview--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/**,https://**--28b43e06-9231-4c54-bc18-a49be01a6516.lovable.app/**,https://quantivis-insights.lovable.app/**
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      LOAD_TARGET: staging
      LOAD_SUPABASE_URL: https://cmnihsbdbpubznlkmjbc.supabase.co
      LOAD_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_FUNCTION_DEPLOY_MAX_ATTEMPTS: "5"
      SUPABASE_FUNCTION_DEPLOY_BASE_DELAY_SECONDS: "5"
      SUPABASE_FUNCTION_DEPLOY_PACE_SECONDS: "2"
      SUPABASE_PRUNE_STALE_REMOTE_FUNCTIONS: "true"
    steps:
      - name: Resolve CI-certified commit
        id: release
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            resolved_sha="$CI_SHA"
          else
            resolved_sha="$CURRENT_SHA"
          fi
          if ! [[ "$resolved_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Staging deployment requires a full 40-character commit SHA"
            exit 1
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::staging environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::staging environment secret SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi
          if [ -z "$LOAD_SUPABASE_ANON_KEY" ]; then
            echo "::error::staging environment secret SUPABASE_ANON_KEY is required for tenant-control-plane evidence"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::staging environment secret SUPABASE_SERVICE_ROLE_KEY is required for tenant-control-plane evidence"
            exit 1
          fi
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM_EMAIL" ]; then
            echo "::error::staging environment secrets RESEND_API_KEY and RESEND_FROM_EMAIL are required for GA Auth email delivery"
            exit 1
          fi
          if [ "$RESEND_FROM_EMAIL" != "alerts@quantivis.io" ]; then
            echo "::error::staging RESEND_FROM_EMAIL must be alerts@quantivis.io"
            exit 1
          fi
          echo "::add-mask::$RESEND_API_KEY"

      - name: Checkout CI-certified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out staging target
        env:
          CERTIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$CERTIFIED_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match CI-certified target $CERTIFIED_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Ensure staging Auth redirect contract
        run: node scripts/configure-supabase-google-oauth.mjs redirects-only

      - name: Build staging client
        run: npm run build -- --mode staging

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify staging migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Generate staging email worker invocation secret
        run: |
          set -Eeuo pipefail
          worker_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$worker_secret"
          echo "EMAIL_QUEUE_WORKER_SECRET=$worker_secret" >> "$GITHUB_ENV"
          supabase secrets set \
            EMAIL_QUEUE_WORKER_SECRET="$worker_secret" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy staging Edge Functions
        run: bash scripts/deploy-supabase-functions-resilient.sh

      - name: Verify staging Edge Functions
        run: bash scripts/verify-supabase-functions.sh

      # Prove the database tenant boundary before Auth-email configuration so an
      # external provider failure cannot mask a P0 authorization regression.
      - name: Seed staging tenant-control-plane proof
        id: tenant_control_seed
        run: npm run tenant-isolation:seed

      - name: Prove staging tenant control plane
        id: tenant_control_proof
        run: |
          set -o pipefail
          mkdir -p artifacts/tenant-control-plane
          npm run tenant-isolation:run | tee artifacts/tenant-control-plane/probes.log

      - name: Teardown staging tenant-control-plane fixtures
        if: ${{ always() && steps.tenant_control_seed.outcome != 'skipped' }}
        run: npm run tenant-isolation:teardown

      - name: Publish staging tenant-control-plane proof
        if: ${{ always() && steps.tenant_control_proof.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-tenant-control-plane-${{ steps.release.outputs.sha }}
          path: artifacts/tenant-control-plane/
          if-no-files-found: error
          retention-days: 30

      # Auth delivery is a release requirement. Provider input, Edge runtime,
      # private worker authorization, hook/cron wiring, custom SMTP and the
      # staging email-capacity limit must all pass before this gate is green.
      - name: Configure independent staging Auth email transport
        id: auth_email
        env:
          CERTIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail

          diagnostic_dir="artifacts/auth-email-transport"
          diagnostic_path="$diagnostic_dir/diagnostic.json"
          mkdir -p "$diagnostic_dir"
          export AUTH_EMAIL_PREFLIGHT_DIAGNOSTIC_PATH="$diagnostic_dir/preflight.json"
          phase="initialise"

          write_diagnostic() {
            local status="$1"
            local exit_code="$2"
            printf '{\n  "status": "%s",\n  "phase": "%s",\n  "exit_code": %s,\n  "project_ref": "%s",\n  "certified_sha": "%s"\n}\n' \
              "$status" "$phase" "$exit_code" "$SUPABASE_PROJECT_REF" "$CERTIFIED_SHA" > "$diagnostic_path"
          }

          on_error() {
            local exit_code="$?"
            trap - ERR
            write_diagnostic "failure" "$exit_code"
            exit "$exit_code"
          }

          trap on_error ERR

          phase="provider-input-preflight"
          node scripts/preflight-supabase-auth-email.mjs provider-input
          phase="provider-secret-rotation"
          supabase secrets set \
            RESEND_API_KEY="$RESEND_API_KEY" \
            RESEND_FROM_EMAIL="$RESEND_FROM_EMAIL" \
            --project-ref "$SUPABASE_PROJECT_REF"

          # Prove the credentials actually active in Supabase plus the worker's
          # dedicated invocation-secret boundary before changing hook/cron.
          phase="runtime-provider-preflight"
          node scripts/preflight-supabase-auth-email.mjs runtime

          phase="disable-existing-transport"
          node scripts/configure-supabase-auth-email.mjs disable
          phase="generate-hook-secret"
          hook_secret="v1,whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$hook_secret"
          export SEND_EMAIL_HOOK_SECRET="$hook_secret"
          phase="hook-secret-rotation"
          supabase secrets set \
            SEND_EMAIL_HOOK_SECRET="$hook_secret" \
            --project-ref "$SUPABASE_PROJECT_REF"
          phase="configure-transport"
          node scripts/configure-supabase-auth-email.mjs configure
          unset SEND_EMAIL_HOOK_SECRET
          phase="verify-transport"
          node scripts/configure-supabase-auth-email.mjs verify

          phase="configure-custom-smtp"
          node scripts/configure-staging-auth-smtp.mjs

          # Client Acceptance deliberately exercises a real recovery email. The
          # staging project therefore gets a bounded, staging-only hourly email
          # allowance high enough for repeated certification runs. Production
          # configuration is never touched by this script.
          phase="configure-staging-rate-limits"
          node scripts/configure-staging-auth-rate-limits.mjs

          phase="complete"
          write_diagnostic "success" "0"
          trap - ERR

      - name: Publish staging Auth email transport diagnostic
        if: ${{ always() && steps.auth_email.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-auth-email-transport-diagnostic-${{ steps.release.outputs.sha }}
          path: artifacts/auth-email-transport/
          if-no-files-found: error
          retention-days: 14
