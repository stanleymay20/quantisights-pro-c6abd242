name: Deploy Supabase Staging

# Every Supabase change reaches staging first. Configure the `staging` GitHub
# Environment with environment-scoped SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD secrets. Production credentials must never be placed in
# this environment.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-staging.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::staging environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::staging environment secret SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.58.5

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify staging migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy staging Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --jobs 4

      - name: Verify staging Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

