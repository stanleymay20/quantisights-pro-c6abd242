name: Deploy Supabase Staging

# Staging is a downstream gate of successful CI for the exact main-branch SHA.
# This prevents push-triggered staging runs from racing or certifying commits whose
# CI has failed or has not completed. Manual dispatch remains available for an
# explicitly selected current SHA.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      SUPABASE_FUNCTION_DEPLOY_MAX_ATTEMPTS: "5"
      SUPABASE_FUNCTION_DEPLOY_BASE_DELAY_SECONDS: "5"
      SUPABASE_FUNCTION_DEPLOY_PACE_SECONDS: "2"
      SUPABASE_PRUNE_STALE_REMOTE_FUNCTIONS: "true"
    steps:
      - name: Resolve CI-certified commit
        id: release
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            resolved_sha="$CI_SHA"
          else
            resolved_sha="$CURRENT_SHA"
          fi
          if ! [[ "$resolved_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Staging deployment requires a full 40-character commit SHA"
            exit 1
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::staging environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::staging environment secret SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi

      - name: Checkout CI-certified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out staging target
        env:
          CERTIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$CERTIFIED_SHA" ]; then
            echo "::error::Checked-out SHA $actual_sha does not match CI-certified target $CERTIFIED_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Build staging client
        run: npm run build -- --mode staging

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify staging migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy staging Edge Functions
        run: bash scripts/deploy-supabase-functions-resilient.sh

      - name: Verify staging Edge Functions
        run: bash scripts/verify-supabase-functions.sh

      # Auth delivery is a release requirement, not an optional convenience.
      # GitHub-managed provider credentials are validated before rotation. If the
      # provider is intentionally managed only in Supabase, preserve those values
      # and validate them inside the service-role-protected worker. Never disable
      # the independent path before the replacement provider/runtime is proven.
      - name: Configure independent staging Auth email transport
        id: auth_email
        env:
          CERTIFIED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail

          diagnostic_dir="artifacts/auth-email-transport"
          diagnostic_path="$diagnostic_dir/diagnostic.json"
          mkdir -p "$diagnostic_dir"
          phase="initialise"

          write_diagnostic() {
            local status="$1"
            local exit_code="$2"
            printf '{\n  "status": "%s",\n  "phase": "%s",\n  "exit_code": %s,\n  "project_ref": "%s",\n  "certified_sha": "%s"\n}\n' \
              "$status" "$phase" "$exit_code" "$SUPABASE_PROJECT_REF" "$CERTIFIED_SHA" > "$diagnostic_path"
          }

          on_error() {
            local exit_code="$?"
            trap - ERR
            write_diagnostic "failure" "$exit_code"
            exit "$exit_code"
          }

          trap on_error ERR

          phase="validate-provider-input-pair"
          if { [ -n "$RESEND_API_KEY" ] && [ -z "$RESEND_FROM_EMAIL" ]; } || \
             { [ -z "$RESEND_API_KEY" ] && [ -n "$RESEND_FROM_EMAIL" ]; }; then
            echo "::error::RESEND_API_KEY and RESEND_FROM_EMAIL must either both be configured or both be absent"
            false
          fi

          if [ -n "$RESEND_API_KEY" ] && [ -n "$RESEND_FROM_EMAIL" ]; then
            echo "::add-mask::$RESEND_API_KEY"
            # Prove the proposed replacement pair before it can overwrite a
            # working Supabase-managed provider configuration.
            phase="provider-input-preflight"
            node scripts/preflight-supabase-auth-email.mjs provider-input
            phase="provider-secret-rotation"
            supabase secrets set \
              RESEND_API_KEY="$RESEND_API_KEY" \
              RESEND_FROM_EMAIL="$RESEND_FROM_EMAIL" \
              --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "Provider credentials are not stored in the staging GitHub Environment; preserving Supabase-managed provider secrets and verifying them fail-closed."
          fi

          # Prove the credentials that are actually active in Supabase plus the
          # worker's exact service-role authorization before changing hook/cron.
          phase="runtime-provider-preflight"
          node scripts/preflight-supabase-auth-email.mjs runtime

          phase="disable-existing-transport"
          node scripts/configure-supabase-auth-email.mjs disable
          phase="generate-hook-secret"
          hook_secret="v1,whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$hook_secret"
          export SEND_EMAIL_HOOK_SECRET="$hook_secret"
          phase="hook-secret-rotation"
          supabase secrets set \
            SEND_EMAIL_HOOK_SECRET="$hook_secret" \
            --project-ref "$SUPABASE_PROJECT_REF"
          phase="configure-transport"
          node scripts/configure-supabase-auth-email.mjs configure
          unset SEND_EMAIL_HOOK_SECRET
          phase="verify-transport"
          node scripts/configure-supabase-auth-email.mjs verify

          # Client Acceptance deliberately exercises a real recovery email. The
          # staging project therefore gets a bounded, staging-only hourly email
          # allowance high enough for repeated certification runs. Production
          # configuration is never touched by this script.
          phase="configure-staging-rate-limits"
          node scripts/configure-staging-auth-rate-limits.mjs

          phase="complete"
          write_diagnostic "success" "0"
          trap - ERR

      - name: Publish staging Auth email transport diagnostic
        if: ${{ always() && steps.auth_email.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-auth-email-transport-diagnostic-${{ steps.release.outputs.sha }}
          path: artifacts/auth-email-transport/diagnostic.json
          if-no-files-found: error
          retention-days: 14
