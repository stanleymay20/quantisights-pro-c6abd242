name: Deploy Supabase Staging

# Every Supabase or release-pipeline change reaches staging first. Staging uses
# the environment-scoped SUPABASE_ACCESS_TOKEN for short-lived JIT database
# access during migrations; no long-lived Postgres password is required.
# Production credentials must never be placed in this environment.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "src/lib/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/deploy-supabase-functions-resilient.sh"
      - "scripts/verify-supabase-functions.sh"
      - "scripts/supabase-jit-access.mjs"
      - "tests/tenant-isolation/**"
      - "src/test/staging-supabase-security.test.ts"
      - "src/test/staging-jit-database-access.test.ts"
      - "src/test/release-certification-chain.test.ts"
      - "src/test/privileged-edge-ci-coverage.test.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-supabase-staging.yml"
      - ".github/workflows/ga-staging-validation.yml"
      - ".github/workflows/ga-readiness.yml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
      SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
      SUPABASE_FUNCTION_DEPLOY_MAX_ATTEMPTS: "5"
      SUPABASE_FUNCTION_DEPLOY_BASE_DELAY_SECONDS: "5"
      SUPABASE_FUNCTION_DEPLOY_PACE_SECONDS: "2"
      SUPABASE_PRUNE_STALE_REMOTE_FUNCTIONS: "true"
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::staging environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Build
        run: npm run build

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.58.5

      - name: Prepare short-lived staging database access
        run: node scripts/supabase-jit-access.mjs prepare

      - name: Preview staging migrations
        run: supabase db push --db-url "$SUPABASE_JIT_DB_URL" --include-all --dry-run

      - name: Apply staging migrations
        run: supabase db push --db-url "$SUPABASE_JIT_DB_URL" --include-all --yes

      - name: Verify staging migration state
        run: supabase migration list --db-url "$SUPABASE_JIT_DB_URL"

      - name: Revoke temporary staging database access
        if: always()
        run: node scripts/supabase-jit-access.mjs cleanup

      - name: Deploy staging Edge Functions
        run: bash scripts/deploy-supabase-functions-resilient.sh

      - name: Verify staging Edge Functions
        run: bash scripts/verify-supabase-functions.sh
