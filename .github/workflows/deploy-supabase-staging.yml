name: Deploy Supabase Staging

# Every Supabase, client-experience, or release-pipeline change reaches staging first. Configure the
# `staging` GitHub Environment with environment-scoped SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD secrets. Production credentials must never be placed in
# this environment.
# Certification trigger note: workflow-source changes intentionally retrigger staging for the exact new SHA.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "src/lib/**"
      - "src/integrations/supabase/**"
      - "src/App.tsx"
      - "src/main.tsx"
      - "src/*.css"
      - "src/pages/ExecutiveDecisionRoom.tsx"
      - "src/pages/EvidencePack.tsx"
      - "src/pages/DecisionReview.tsx"
      - "src/pages/Index.tsx"
      - "src/pages/Pricing.tsx"
      - "src/pages/Register.tsx"
      - "src/pages/CompetitiveAnalysis.tsx"
      - "src/data/competitive-landscape.ts"
      - "src/hooks/useSubscription.ts"
      - "src/hooks/useSubscriptionGate.ts"
      - "src/components/SubscriptionGate.tsx"
      - "src/components/auth/RouteEntitlement.tsx"
      - "src/components/decisions/**"
      - "src/components/landing/**"
      - "src/components/layout/**"
      - "src/routes/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "playwright.client-acceptance.config.ts"
      - "scripts/deploy-supabase-functions-resilient.sh"
      - "scripts/verify-supabase-functions.sh"
      - "scripts/verify-live-release-provenance.mjs"
      - "tests/tenant-isolation/**"
      - "tests/client-acceptance/**"
      - "src/test/executive-decision-room.test.ts"
      - "src/test/decision-visualization.test.ts"
      - "src/test/staging-supabase-security.test.ts"
      - "src/test/entitlement-enforcement.test.ts"
      - "src/test/release-certification-chain.test.ts"
      - "src/test/privileged-edge-ci-coverage.test.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-supabase-staging.yml"
      - ".github/workflows/ga-staging-validation.yml"
      - ".github/workflows/client-acceptance.yml"
      - ".github/workflows/ga-readiness.yml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cmnihsbdbpubznlkmjbc
      SUPABASE_FUNCTION_DEPLOY_MAX_ATTEMPTS: "5"
      SUPABASE_FUNCTION_DEPLOY_BASE_DELAY_SECONDS: "5"
      SUPABASE_FUNCTION_DEPLOY_PACE_SECONDS: "2"
      SUPABASE_PRUNE_STALE_REMOTE_FUNCTIONS: "true"
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::staging environment secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::staging environment secret SUPABASE_DB_PASSWORD is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Evidence framework tests
        run: npm run evidence:test

      - name: Verify security configuration
        run: npm run verify:security-config

      - name: Build
        run: npm run build

      - name: Build supplier-risk Edge runtime bundle
        run: node scripts/build-supplier-risk-edge-runtime.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.58.5

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply staging migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify staging migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy staging Edge Functions
        run: bash scripts/deploy-supabase-functions-resilient.sh

      - name: Verify staging Edge Functions
        run: bash scripts/verify-supabase-functions.sh
